   <div class="row"><button class="btn pri" id="pick">Choose Excel file</button><button class="btn" onclick="dlg.close()">Done</button></div>
   <div class="msg ${cls||''}" id="um">${msg||''}</div>
   ${dates.length?`<ul class="daylist">${dates.map(d=>`<li><span>${dlabel(d)} <small style="color:var(--muted)">${S.days[d].count} tasks</small></span><button class="btn danger" data-del="${d}">Delete</button></li>`).join('')}</ul>`:''}
   <hr><div class="set"><label>Daily KPI target (tasks)<input id="sT" type="number" min="1" value="${S.settings.target}"></label><label>Late start after<input id="sL" type="time" value="${S.settings.late}"></label></div>
   <div class="row"><button class="btn" id="sv">Save settings</button></div>`;
  if(!dlg.open)dlg.showModal();{const m=$('#um');if(m&&cls==='err')m.setAttribute('role','alert');}
  $('#pick').onclick=()=>$('#file').click();
  $('#sv').onclick=async()=>{S.settings.target=Math.max(1,+$('#sT').value||4);S.settings.late=$('#sL').value||'10:00';try{await saveSettings();showManage('Settings saved.','ok');}catch(e){showManage('Could not save settings: '+(e.message||e.code),'err');}render();};
  dlg.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirm delete';return;}
    try{await deleteDay(b.dataset.del);showManage(dlabel(b.dataset.del)+' deleted.','ok');}catch(e){showManage('Delete failed: '+(e.message||e.code),'err');}render();});
}
$('#fab').onclick=openDlg;
$('#file').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const um=()=>$('#um');um().className='msg';um().textContent='Reading '+files.map(f=>f.name).join(', ')+'…';
  try{let saved=[];for(const f of files){if(!/\.(xlsx|xlsm|xls|csv)$/i.test(f.name))throw new Error('“'+f.name+'” is not an Excel file. Please choose the .xlsx daily file.');let wb;try{wb=XLSX.read(await f.arrayBuffer(),{type:'array'});}catch(x){throw new Error('“'+f.name+'” could not be opened. The file may be damaged or password-protected.');}const rows=parseWorkbook(XLSX,wb);
      if(!rows.length)throw new Error('“'+f.name+'” is not a Box-Ops daily report file. No rows with Task No and Schedule Date were found.');
      for(const [d,a] of groupBy(rows,'date')){um().textContent='Saving '+dlabel(d)+' ('+a.length+' tasks)…';await saveDay(d,a,f.name);saved.push(dlabel(d)+' ('+a.length+')');}}
    const keepFrom=addDays(Object.keys(S.days).sort().pop(),-(KEEP-1));const old=Object.keys(S.days).filter(d=>d<keepFrom);
    for(const d of old){um().textContent='Removing '+dlabel(d)+' (older than '+KEEP+' days)…';await deleteDay(d);}
    if(old.length)saved.push('removed '+old.length+' day(s) older than '+KEEP+' days');
    const last=Object.keys(S.days).sort().pop();S.from=last;S.to=last;S.twn='all';render();showManage('Saved '+saved.join(', ')+'.','ok');}
  catch(err){console.error(err);showManage(err.code==='quota_exceeded'?'Storage is full. Delete old days, then upload again.':('Upload failed. '+(err.message||'Could not save to the portal ('+err.code+'). Check your connection and try again.')),'err');}};

// ---------- boot ----------
document.title='Box-Ops daily report '+APP_VERSION;['verNo','verBrand'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=APP_VERSION;});
(async()=>{
  const l=localGet();if(l){S.days=l.days||{};S.rows=(l.rows||[]).map(toObj);Object.assign(S.settings,l.settings||{});}
  let db=null;
  if(SUPABASE_URL&&SUPABASE_ANON_KEY)db=supaDb(SUPABASE_URL,SUPABASE_ANON_KEY);
  else{try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){}}
  S.db=db;await loadAll();await loadTodayPlan();render();
})();

// ---------- filter bar wiring ----------
function wireBar(asc){const len=()=>daysBetween(S.to,S.from)+1;
  const set=(f,t)=>{if(f>t)[f,t]=[t,f];S.from=f;S.to=t;render();};
  $('#fFrom').onchange=e=>{if(e.target.value)set(e.target.value,S.to<e.target.value?e.target.value:S.to);};
  $('#fTo').onchange=e=>{if(e.target.value)set(S.from>e.target.value?e.target.value:S.from,e.target.value);};
  $('#fTwnS').onchange=e=>{S.twn=e.target.value;render();};
  document.querySelectorAll('[data-qk]').forEach(b=>b.onclick=()=>{const n=+b.dataset.qk;set(addDays(S.to,-(n-1)),S.to);});
  // one day: jump to the previous / next day that has data; a range: shift by its length
  $('#fPrev').onclick=()=>{if(S.from===S.to){const p=asc.filter(d=>d<S.from).pop();if(p)set(p,p);}else{const n=len();set(addDays(S.from,-n),addDays(S.to,-n));}};
  $('#fNext').onclick=()=>{if(S.from===S.to){const p=asc.find(d=>d>S.to);if(p)set(p,p);}else{const n=len();set(addDays(S.from,n),addDays(S.to,n));}};}
// ---------- multi-select filter (not used in the bar any more) ----------
function multi(id,label,opts,sel,allTxt){const s=new Set(sel);
  const txt=!sel.length?allTxt:sel.length===1?(opts.find(o=>o[0]===sel[0])||[,sel[0]])[1]:sel.length+' '+label.toLowerCase()+' selected';
  return `<div class="ms" id="${id}"><span class="ms-l">${label}</span><button type="button" class="ms-b" aria-haspopup="true" aria-expanded="false">${esc(txt)}</button>
  <div class="ms-p" hidden><div class="ms-a"><button type="button" data-all>Select all</button><button type="button" data-none>Clear</button></div>
  <div class="ms-list">${opts.map(([v,l])=>`<label><input type="checkbox" value="${esc(v)}" ${s.has(v)?'checked':''}> ${esc(l)}</label>`).join('')}</div>
  <div class="ms-f"><button type="button" class="btn pri" data-apply>Apply</button></div></div></div>`;}
function wireMulti(id,key){const w=document.getElementById(id);const b=w.querySelector('.ms-b'),p=w.querySelector('.ms-p');const cbs=[...p.querySelectorAll('input')];
  const open=o=>{p.hidden=!o;b.setAttribute('aria-expanded',o);};
  b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.ms-p').forEach(x=>{if(x!==p)x.hidden=true;});open(p.hidden);};
  p.onclick=e=>e.stopPropagation();
  p.querySelector('[data-all]').onclick=()=>cbs.forEach(c=>c.checked=true);
  p.querySelector('[data-none]').onclick=()=>cbs.forEach(c=>c.checked=false);
  p.querySelector('[data-apply]').onclick=()=>{const v=cbs.filter(c=>c.checked).map(c=>c.value);S[key]=v.length===cbs.length?[]:v;render();};}
document.addEventListener('click',()=>document.querySelectorAll('.ms-p').forEach(p=>{if(!p.hidden){p.hidden=true;p.previousElementSibling.setAttribute('aria-expanded','false');}}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ms-p').forEach(p=>p.hidden=true);});

</script>
