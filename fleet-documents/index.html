<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Frontiir Fleet Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#23272B; --muted:#586069; --line:#D8DBD4;
  --road:#2F3439; --road-ink:#F2F3EF; --lane:#F2B705;
  --stop:#C3342B; --warn:#E0A000; --info:#1F5FA8; --ok:#2F7D4F;
  --stop-soft:#F8E4E2; --warn-soft:#FBF1D6; --info-soft:#E2ECF7; --ok-soft:#E1F0E7;
  --display:"Barlow Condensed","Arial Narrow","Noto Sans Myanmar",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;
  --mm:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F22; --surface:#25292D; --ink:#ECEEEA; --muted:#A5ACB2; --line:#3B4147;
    --road:#15181B; --road-ink:#ECEEEA;
    --stop:#E5584E; --warn:#F0B429; --info:#5B9BE0; --ok:#5FB585;
    --stop-soft:#3D2522; --warn-soft:#3A3120; --info-soft:#1F2D3D; --ok-soft:#1F3328;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1F22; --surface:#25292D; --ink:#ECEEEA; --muted:#A5ACB2; --line:#3B4147;
  --road:#15181B; --road-ink:#ECEEEA;
  --stop:#E5584E; --warn:#F0B429; --info:#5B9BE0; --ok:#5FB585;
  --stop-soft:#3D2522; --warn-soft:#3A3120; --info-soft:#1F2D3D; --ok-soft:#1F3328;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
img,svg{max-width:100%}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px;border-radius:3px}
.mm{font-family:var(--mm);line-height:1.9}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.prose{max-width:72ch}

/* top nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--road);color:var(--road-ink);border-bottom:4px solid var(--lane)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:56px;overflow-x:auto}
.nav strong{font-family:var(--display);font-size:20px;letter-spacing:.02em;white-space:nowrap}
.nav a{color:var(--road-ink);text-decoration:none;font-weight:500;white-space:nowrap;opacity:.85;padding:6px 2px}
.nav a:hover{opacity:1;text-decoration:underline;text-decoration-color:var(--lane);text-underline-offset:5px}
.nav .spacer{flex:1}

/* hero */
.hero{background:var(--road);color:var(--road-ink);padding:40px 0 0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1.02;margin:0 0 6px;max-width:18ch}
.hero .mmtitle{font-family:var(--mm);font-size:17px;opacity:.8;margin:0 0 20px;line-height:1.8}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0 0 30px;padding:0;list-style:none;font-size:15px}
.meta li span{display:block;opacity:.65;font-size:13px}
.meta b{font-weight:600}
.meta .flag{color:var(--lane)}

/* road strip */
.roadscroll{overflow-x:auto;padding-bottom:26px}
.road{position:relative;min-width:760px;display:grid;grid-template-columns:repeat(8,1fr);padding:22px 0 0}
.road::before{content:"";position:absolute;left:0;right:0;top:49px;height:4px;
  background:repeating-linear-gradient(90deg,var(--lane) 0 26px,transparent 26px 44px)}
.stopbtn{position:relative;background:none;border:0;color:var(--road-ink);cursor:pointer;text-align:center;padding:0 4px;font:inherit}
.stopbtn .num{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:50%;
  background:var(--road);border:3px solid var(--road-ink);font-family:var(--display);font-size:28px;font-weight:700;position:relative;z-index:1}
.stopbtn:hover .num{border-color:var(--lane);color:var(--lane)}
.stopbtn .lbl{display:block;font-size:14px;margin-top:10px;line-height:1.25;min-height:36px}
.stopbtn .signs{display:flex;justify-content:center;gap:8px;margin-top:6px;font-size:13px;font-weight:600}
.stopbtn .signs span{display:inline-flex;align-items:center;gap:3px}
.stopbtn .signs svg{width:16px;height:16px}

/* sections */
section{padding:52px 0 8px}
h2{font-family:var(--display);font-size:38px;line-height:1.05;margin:0 0 14px}
h3{font-family:var(--display);font-size:25px;line-height:1.1;margin:28px 0 10px}
p{margin:0 0 14px}
.lede{font-size:19px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.panel.good{border-left:6px solid var(--ok)}
.panel.bad{border-left:6px solid var(--stop)}
.panel h3{margin-top:0}
.panel ul{margin:0;padding-left:20px}
.panel li{margin-bottom:8px}

.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:20px;height:20px}

.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:14px 18px;font-size:15px;margin-top:22px}

/* chapters */
details.ch{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:12px}
details.ch>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 18px}
details.ch>summary::-webkit-details-marker{display:none}
.chnum{width:46px;height:46px;border-radius:50%;background:var(--road);color:var(--road-ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;border:3px solid var(--lane)}
.chtitle b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.chtitle .mm{display:block;font-size:14px;color:var(--muted);line-height:1.7}
.chsigns{display:flex;gap:10px;font-weight:600;font-size:14px}
.chsigns span{display:inline-flex;align-items:center;gap:4px}
.chsigns svg{width:18px;height:18px}
.chevron{transition:transform .2s}
details.ch[open] .chevron{transform:rotate(90deg)}
.chbody{padding:0 22px 22px;border-top:1px solid var(--line)}
.chbody .gist{margin-top:16px;font-size:18px}
.clauses{width:100%;border-collapse:collapse;margin:8px 0 6px}
.clauses td{vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line);font-size:16px}
.clauses td:first-child{white-space:nowrap;font-weight:600;color:var(--muted);width:70px}
.clauses td:nth-child(2){font-weight:600;width:190px}
@media (max-width:640px){
  .clauses tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  .clauses td{display:inline;border:0;padding:0 6px 0 0}
  .clauses td:last-child{display:block;padding-top:3px}
  details.ch>summary{grid-template-columns:46px 1fr}
  .chsigns{grid-column:2}
}
.tablewrap{overflow-x:auto;margin:10px 0 4px}
table.rates{border-collapse:collapse;min-width:640px;width:100%;font-size:15px}
table.rates th,table.rates td{border:1px solid var(--line);padding:8px 10px;text-align:right}
table.rates th{background:var(--bg);font-weight:600}
table.rates th:first-child,table.rates td:first-child,table.rates td:nth-child(2){text-align:left}

.chflags{margin-top:18px}
.chflags h4{font-family:var(--display);font-size:20px;margin:0 0 8px}

/* issue rows */
.issue{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.issue>svg{width:26px;height:26px;margin-top:2px}
.issue .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.issue .t{font-weight:600;font-size:17px}
.tag{font-size:13px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.issue p{margin:6px 0 0;font-size:16px}
.issue .fix{background:var(--ok-soft);border-radius:4px;padding:8px 12px;margin-top:8px;font-size:16px}
.issue .fix b{color:var(--ok)}

/* findings board */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0 18px}
.filters .grp{display:flex;flex-wrap:wrap;gap:6px}
.filters .glabel{font-size:14px;color:var(--muted);margin-right:4px;align-self:center}
.fbtn{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:5px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fbtn svg{width:15px;height:15px}
.fbtn[aria-pressed="true"]{background:var(--road);color:var(--road-ink);border-color:var(--road)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 22px}
.count{font-size:15px;color:var(--muted)}
.empty{padding:22px 0;color:var(--muted)}

/* calculator */
.calc{background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:16px 18px;margin:16px 0 4px}
.calc h4{font-family:var(--display);font-size:20px;margin:0 0 4px}
.calc .row{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}
.calc label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc select,.calc input{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:120px}
.calc .out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.calc .out div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.calc .out span{display:block;font-size:13px;color:var(--muted)}
.calc .out b{font-family:var(--display);font-size:26px}
.calc .out .neg b{color:var(--stop)}
.calc small{display:block;color:var(--muted);margin-top:8px;font-size:13px}

/* steps */
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:10px 0 0}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s);width:36px;height:36px;border-radius:4px;background:var(--lane);color:#23272B;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
ol.steps b{display:block;font-size:17px}

footer{margin-top:50px;padding:26px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.langsw{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden;flex-shrink:0}
.langsw button{font:inherit;font-size:14px;background:transparent;color:var(--road-ink);border:0;padding:5px 12px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--lane);color:#23272B;font-weight:600}
body.lang-my{font-family:var(--mm);font-size:16px;line-height:1.9}
body.lang-my h1{font-family:var(--mm);font-size:clamp(26px,4.4vw,40px);line-height:1.6;max-width:none}
body.lang-my h2,body.lang-my h3,body.lang-my .chtitle b,body.lang-my .chflags h4,body.lang-my .calc h4{font-family:var(--mm);line-height:1.6}
body.lang-my h2{font-size:30px}
body.lang-my h3{font-size:21px}
body.lang-my .chtitle b{font-size:19px}
body.lang-my .hero .mmtitle{font-family:var(--body)}
body.lang-my .stopbtn .lbl{font-size:13px;line-height:1.6}
body.lang-my .lede{font-size:17px}
body.lang-my .gist{font-size:17px}
body.lang-my .issue .t{line-height:1.7}
body.lang-my .nav strong{font-family:var(--mm);font-size:16px}
.small-note{font-size:14px;color:var(--muted)}
.small-p{font-size:15px;margin:0}
body.locked .nav,body.locked .hero,body.locked main{display:none}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--road);color:var(--road-ink)}
body:not(.locked) .gate{display:none}
.gatebox{width:100%;max-width:380px;border-top:4px solid var(--lane);padding-top:22px}
.gatebox h1{font-family:var(--display);font-size:32px;line-height:1.1;margin:0 0 4px}
.gatebox .mm{opacity:.8;font-size:15px;margin:0 0 22px}
.gatebox label{display:block;font-size:14px;margin-bottom:6px}
.gatebox input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:4px;border:2px solid #6B737B;background:var(--surface);color:var(--ink)}
.gatebox input[aria-invalid="true"]{border-color:var(--stop)}
.gatebox button{margin-top:12px;width:100%;font:inherit;font-weight:600;font-size:17px;padding:10px;border:0;border-radius:4px;background:var(--lane);color:#23272B;cursor:pointer}
.gatebox button[disabled]{opacity:.7;cursor:wait}
.gerr{margin-top:12px;min-height:3.4em;font-size:15px;line-height:1.5}
.gerr:not(:empty){background:var(--stop-soft);color:var(--ink);border-left:4px solid var(--stop);padding:8px 12px;border-radius:3px}
.gerr .mm{display:block;margin:2px 0 0;opacity:1;font-size:14px}
.headrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:6px}
.headrow h2{margin:0}
.actions,.chactions,.formbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abtn{font:inherit;font-size:15px;font-weight:600;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.abtn:hover{border-color:var(--ink)}
.abtn.primary{background:var(--lane);border-color:var(--lane);color:#23272B}
.abtn[disabled]{opacity:.65;cursor:wait}
.status{font-size:14px;color:var(--stop);margin:8px 0 0}
.status:empty{display:none}
#histStatus{color:var(--muted)}
.chactions{margin-top:16px}
.chactions .status{margin:0}
.toc{list-style:none;padding:0;margin:16px 0 0;border-top:1px solid var(--line)}
.toc li{border-bottom:1px solid var(--line)}
.tocitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:start;width:100%;padding:14px 4px}
.tocitem:hover .ttext b{text-decoration:underline;text-decoration-color:var(--lane);text-underline-offset:4px}
.tocitem:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.tnum{width:40px;height:40px;border-radius:50%;background:var(--road);color:var(--road-ink);display:grid;place-items:center;font-family:var(--display);font-size:21px;font-weight:700;border:3px solid var(--lane)}
.ttext b{display:block;font-family:var(--display);font-size:22px;line-height:1.15}
.talt{display:block;font-size:14px;color:var(--muted);line-height:1.7}
.tsubs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:14px;color:var(--muted)}
.tcount{font-size:14px;color:var(--muted);white-space:nowrap;padding-top:8px}
@media (max-width:640px){.tocitem{grid-template-columns:40px 1fr}.tcount{grid-column:2;padding:0}}
body.lang-my .ttext b{font-family:var(--mm);font-size:18px;line-height:1.7}
table.hist{border-collapse:collapse;width:100%;min-width:720px;font-size:15px;background:var(--surface);border:1px solid var(--line)}
table.hist th,table.hist td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
table.hist th{background:var(--bg);font-weight:600;font-size:14px}
table.hist td.notes{max-width:32ch}
.fname{display:block;font-size:13px;color:var(--muted);word-break:break-all}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--ok);border-radius:20px;padding:1px 8px;margin-left:4px}
.linkbtn{font:inherit;font-size:15px;background:none;border:0;padding:0;color:var(--info);text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--stop)}
.upform{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--lane);border-radius:6px;padding:18px 20px;margin:14px 0}
.upform h3{margin:0 0 12px}
.upform .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.upform .wide{grid-column:1/-1}
@media (max-width:640px){.upform .grid{grid-template-columns:1fr}}
.upform label span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.upform input[type=text],.upform input[type=date],.upform textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.upform input[type=file]{font:inherit;font-size:15px;color:var(--ink)}
.uerr{margin:12px 0 0}
.uerr:not(:empty){background:var(--stop-soft);border-left:4px solid var(--stop);padding:8px 12px;border-radius:3px;font-size:15px}
.formbtns{margin-top:14px}
.okmsg{color:var(--ok);font-weight:600;margin:8px 0}
.okmsg:empty{display:none}
.notice[hidden],.upform[hidden]{display:none}
.notice{margin:10px 0 14px}
footer{font-size:14px}
/* print */
.printhead{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#444;--line:#bbb}
  body{background:#fff!important;color:#111!important;font-size:12pt}
  .nav,.hero,#history,footer,.gate,.chactions,.chevron,#chapters>.headrow,#chapters>.prose{display:none!important}
  .wrap{max-width:none;padding:0}
  section{padding:0}
  body.printing details.ch:not(.print-target){display:none!important}
  details.ch{border:0;break-before:page;margin:0}
  details.ch:first-of-type,details.print-target:first-of-type{break-before:auto}
  details.ch>summary{padding:0 0 8px;grid-template-columns:44px 1fr}
  .chbody{border:0;padding:0}
  .chnum{background:#fff;color:#111}
  .printhead{display:block;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
  .ph-title{font-weight:700;font-size:15pt}
  .ph-meta{font-size:10pt;color:#444}
  .ph-sub{font-size:11pt;margin-top:4px}
  .clauses tr{break-inside:avoid}
  .tablewrap{overflow:visible}
  table.rates{min-width:0}
}
/* pdf render stage (off-screen, always light) */
.pdfstage{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pdfstage:empty{display:none}
.pdfdoc{width:794px;background:#fff;color:#1d2125;font-family:"Barlow","Noto Sans Myanmar",sans-serif;font-size:14px;line-height:1.55;padding:0 4px}
.pdfstage.lang-my .pdfdoc{font-family:"Noto Sans Myanmar","Barlow",sans-serif;line-height:1.9}
.pdfdoc .pd-head{border-bottom:2px solid #1d2125;padding-bottom:8px;margin-bottom:16px}
.pdfdoc .pd-title{font-size:20px;font-weight:700;line-height:1.4}
.pdfdoc .pd-meta{font-size:12px;color:#555}
.pdfdoc .pd-chh{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.pdfdoc .pd-num{width:36px;height:36px;border-radius:50%;border:3px solid #F2B705;display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0;line-height:30px;text-align:center}
.pdfdoc .pd-cht{font-size:18px;font-weight:700;line-height:1.4}
.pdfdoc .pd-cha{font-size:12px;color:#555}
.pdfdoc .pd-gist{font-size:14px;margin:0 0 8px}
.pdfdoc table{border-collapse:collapse;width:100%}
.pdfdoc .clauses td{border-bottom:1px solid #ccc;padding:7px 6px;font-size:13px;color:#1d2125;vertical-align:top}
.pdfdoc .clauses td:first-child{width:56px;color:#555;font-weight:600;white-space:nowrap}
.pdfdoc .clauses td:nth-child(2){width:170px;font-weight:600}
.pdfdoc .tablewrap{overflow:visible}
.pdfdoc table.rates{min-width:0;font-size:12px}
.pdfdoc table.rates th,.pdfdoc table.rates td{border:1px solid #bbb;padding:5px 6px;color:#1d2125;background:#fff}
.pdfdoc table.rates th{background:#f1f2ee}
.pdfdoc .small-note{font-size:11px;color:#555}
.doctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.dtab{font:inherit;font-size:15px;font-weight:600;padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--road-ink);cursor:pointer}

.dtab.att{display:inline-flex;align-items:center;gap:7px}

section[hidden],.nav a[hidden]{display:none!important}
.attsum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 4px}

.sumcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sumcard:hover{border-color:var(--ink)}
.sumcard:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.sumcard[aria-pressed="true"]{border-color:var(--road);box-shadow:inset 0 0 0 2px var(--road)}
.sumcard b{font-family:var(--display);font-size:32px;line-height:1;grid-row:span 2}
.sumcard small{font-size:13px;color:var(--stop);font-weight:600}
.sumcard em{grid-column:1/-1;font-style:normal;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.role{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.role-law{background:var(--info-soft);color:var(--info)}
.role-fleet{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.role-hr{background:var(--ok-soft);color:var(--ok)}
.attwrap{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.att{border-collapse:collapse;width:100%;min-width:1040px;font-size:14.5px}
table.att th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:13px;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
table.att td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}

table.att tr.sev-high td:first-child{box-shadow:inset 4px 0 0 var(--stop)}
table.att tr.sev-med td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
table.att tr.sev-low td:first-child{box-shadow:inset 4px 0 0 var(--info)}
table.att td.n{color:var(--muted);width:34px;padding-left:14px}
table.att td.pr{white-space:nowrap;width:110px}
table.att td.pr .sg{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
table.att td.ref{white-space:nowrap;color:var(--muted);font-weight:600}
table.att td.fd{width:36%}
table.att td.fd b{display:block;margin-bottom:3px}
table.att td.fd span{color:var(--ink)}
table.att td.rc{width:28%;background:var(--ok-soft)}
table.att td.empty{color:var(--muted);text-align:center;padding:24px}
body.lang-my table.att{font-size:14px;line-height:1.85}
.attnote{margin-top:12px;font-size:14px}
.count{font-size:14px;color:var(--muted);margin:8px 0 0}

.pdfdoc table.att td.rc{background:#eaf4ee}

.pdfdoc .sg{width:13px;height:13px}
.stat{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:4px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.stat-new{background:var(--stop-soft);color:var(--stop);border-color:var(--stop)}
.stat-open{background:var(--surface);color:var(--ink);border-color:var(--ink)}

table.att tr.st-fixed td.fd b{text-decoration:line-through;text-decoration-color:var(--ok)}
.pdfdoc .stat{background:#fff;color:#1d2125;border:1px solid #999}

.fabtn{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:5px 12px;border-radius:20px;border:1px solid var(--lane);background:transparent;color:var(--lane);cursor:pointer;flex-shrink:0}

.fabtn.on{border-color:#5FB585;color:var(--road-ink)}

.fabtn .dot{width:8px;height:8px;border-radius:50%;background:#5FB585}

.famodal[hidden]{display:none}
.fabox{width:100%;max-width:400px;background:var(--surface);color:var(--ink);border-radius:8px;border-top:5px solid var(--lane);padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.fabox h2{font-size:26px;margin:0 0 6px}
.fabox p{font-size:15px;color:var(--muted);margin:0 0 14px}
.fabox label{display:block;font-size:14px;margin-bottom:6px}
.fabox input{width:100%;font:inherit;font-size:17px;padding:9px 11px;border-radius:4px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fabox input[aria-invalid="true"]{border-color:var(--stop)}
.faerr{margin-top:10px;font-size:15px}
.faerr:not(:empty){background:var(--stop-soft);border-left:4px solid var(--stop);padding:8px 12px;border-radius:3px}
.fabtns{display:flex;gap:8px;margin-top:14px}

.uhint{font-size:14px;color:var(--muted);margin:-6px 0 12px}

.polwrap{border:1px solid var(--line);border-radius:6px;background:var(--surface)}

", "Fuel KPI", "Monthly fuel consumption is a key performance KPI. Drive to the set fuel standards.", "လောင်စာဆီ KPI", "လစဉ် လောင်စာဆီသုံးစွဲမှုသည် အဓိက စွမ်းဆောင်ရည် KPI ဖြစ်သည်။ သတ်မှတ်စံနှုန်းအတိုင်း မောင်းနှင်ရမည်။"], ["2.3", "Misuse of property", "No theft or misuse of the vehicle, parts or fuel; no unauthorised passengers; no personal use; no letting others drive. Immediate termination possible.", "ကုမ္ပဏီပစ္စည်း အလွဲသုံးစားပြုခြင်း", "ယာဉ်၊ အစိတ်အပိုင်း၊ လောင်စာဆီ မခိုးယူရ၊ အလွဲမသုံးရ၊ ခွင့်ပြုချက်မရှိသူကို မတင်ဆောင်ရ၊ ကိုယ်ရေးကိုယ်တာ မသုံးရ၊ အခြားသူကို မမောင်းခိုင်းရ။ ချက်ချင်း အလုပ်ရပ်စဲနိုင်သည်။"], ["2.4", "Parking", "Ferry cars park at Showroom Parking; all other vehicles at MEPY HQ only. No moving them without Fleet approval.", "ယာဉ်ရပ်နားခြင်း", "Ferry Car များကို Showroom Parking၊ အခြားယာဉ်များကို MEPY HQ တွင်သာ ရပ်နားရမည်။ Fleet ခွင့်ပြုချက်မရှိဘဲ မရွှေ့ရ။"], ["2.5", "Taking the car home", "Not allowed without prior approval. In an emergency, get the Leader's approval first.", "ယာဉ်ကို အိမ်သို့ ယူဆောင်ခြင်း", "ကြိုတင်ခွင့်ပြုချက်မရှိဘဲ မယူရ။ အရေးပေါ်ဖြစ်ပါက Leader ၏ ကြိုတင်ခွင့်ပြုချက် ရယူရမည်။"], ["2.6", "Safe driving", "Obey traffic rules. No speeding, dangerous or careless driving. Complaints can lead to action.", "ဘေးကင်းစွာ မောင်းနှင်ခြင်း", "ယာဉ်စည်းကမ်း လိုက်နာရမည်။ အရှိန်လွန်၊ အန္တရာယ်ရှိစွာ၊ မဆင်မခြင် မမောင်းရ။ တိုင်ကြားချက်ရှိပါက အရေးယူနိုင်သည်။"], ["2.7", "Daily reports", "Attendance, Kilometer, Fuel Request and 3-Team Car Share Photo reports, every day.", "နေ့စဉ် အစီရင်ခံစာ", "Attendance၊ Kilometer၊ Fuel Request နှင့် 3-Team Car Share Photo Report များကို နေ့စဉ် တင်ပြရမည်။"], ["2.8", "Punctuality", "Arrive and be ready before duty time. Repeated lateness is actionable.", "အချိန်မှန်ခြင်း", "တာဝန်ချိန်မတိုင်မီ ရောက်ရှိ အသင့်ဖြစ်ရမည်။ ထပ်ခါတလဲလဲ နောက်ကျပါက အရေးယူနိုင်သည်။"], ["2.9", "Emergency vehicle use", "Using another vehicle in an emergency needs the Manager's prior approval.", "အရေးပေါ် ယာဉ်အသုံးပြုခြင်း", "အရေးပေါ်တွင် အခြားယာဉ်ကို အသ ိုအပ်ချက်အရ ဤစည်းမျဉ်းများကို ပြင်ဆင်နိုင်သည်။"]], "lab": "2"}, {"n": 3, "en": "Accidents & liability", "my": "ယာဉ်မတော်တဆမှုနှင့် တာဝန်ယူမှုဆိုင်ရာ မူဝါဒ", "smy": "မတော်တဆမှုနှင့် တာဝန်ယူမှု", "g": ["Three accident tiers by injury and cost, each with a handling route, an insurance decision and possible driver liability.", "ဒဏ်ရာနှင့် ကုန်ကျစရိတ်အလိုက် ယာဉ်မတော်တဆမှု အဆင့် (၃) ဆင့်၊ အဆင့်တစ်ခုစီတွင် ကိုင်တွယ်ပုံ၊ အာမခံဆုံးဖြတ်ချက်နှင့် ယာဉ်မောင်း တာဝန်ယူရမှု ပါဝင်သည်။"], "cl": [["Intro", "General duty", "Drive defensively, report any accident to the Fleet Team immediately, and cooperate with investigations, insurers and authorities. The Fleet Manager decides whether insurance is used.", "ယေဘုယျ တာဝန်", "သတိထား မောင်းနှင်ရမည်၊ ယာဉ်မတော်တဆမှုကို Fleet Team ထံ ချက်ချင်း အကြောင်းကြားရမည်၊ စုံစမ်းစစ်ဆေးမှု၊ အာမခံနှင့် အာဏာပိုင်များနှင့် ပူးပေါင်းဆောင်ရွက်ရမည်။ အာမခံ အသုံးပြုမည်/မပြုမည်ကို Fleet Manager က ဆုံးဖြတ်သည်။"], ["3.1", "Impairment-caused", "Accidents caused by alcohol, drugs, distraction, rage or reckless driving lead to discipline and company-set liability.", "မူးယစ်/မဆင်မခြင်မှုကြောင့် ဖြစ်ပွားခြင်း", "အရက်၊ မူးယစ်ဆေး၊ အာရုံပျံ့လွင့်မှု၊ ဒေါသ သို့မဟုတ် မဆင်မခြင်မောင်းနှင်မှုကြောင့် ဖြစ်ပါက စည်းကမ်းအရေးယူမှုနှင့် ကုမ္ပဏီသတ်မှတ် တာဝန်ယူမှု ရှိမည်။"], ["3.2", "Authorities", "Driver and Fleet Team accept and follow Traffic Police and authority decisions.", "အာဏာပိုင် ဆုံးဖြတ်ချက်", "ယာဉ်မောင်းနှင့် Fleet Team သည် Traffic Police နှင့် အာဏာပိုင်များ၏ ဆုံးဖြတ်ချက်များကို လိုက်နာရမည်။"], ["3.3", "Minor accident", "All of: no injuries, only minor damage or scratches, total cost under MMK 500,000. Report and follow Fleet instructions. Insurance is not used; the repair cost may be recovered from the driver.", "အသေးစား ယာဉ်မတော်တဆမှု", "အောက်ပါအားလုံးနှင့် ကိုက်ညီရမည် — ဒဏ်ရာမရှိ၊ ပျက်စီးမှု/ခြစ်ရာ အနည်းငယ်သာ၊ စုစုပေါင်းကုန်ကျစရိတ် MMK 500,000 အောက်။ အာမခံမသုံးဘဲ ပြုပြင်စရိတ်ကို ယာဉ်မောင်းထံမှ ကောက်ခံနိုင်သည်။"], ["3.4", "Medium accident", "Any of: one or more injured, vehicle cannot be driven, cost MMK 5 to 50 lakh. Fleet handles it directly and uses insurance. Liability can be a fixed sum, a percentage or up to 100%. Sanction: Final Warning, Suspension or Termination.", "အလတ်စား ယာဉ်မတော်တဆမှု", "အောက်ပါ တစ်ခုခု — ဒဏ်ရာရသူရှိ၊ ယာဉ်ဆက်မမောင်းနိုင်၊ ကုန်ကျစရိတ် ၅ သိန်းမှ သိန်း ၅၀။ Fleet က တိုက်ရိုက်ကိုင်တွယ်ပြီး အာမခံသုံးမည်။ လျော်ကြေးသည် ပုံသေပမာဏ၊ ရာခိုင်နှုန်း သို့မဟုတ် ၁၀၀% အထိ။ Final Warning၊ Suspension သို့မဟုတ် Termination။"], ["3.5", "Serious accident", "Any of: a death, vehicle written off or unusable under KaNyaNa rules, cost MMK 50 to 100+ lakh. Fleet Manager and Director handle it, with insurance and possible family support. Liability up to 100%, plus discipline. The driver handles any legal case against them personally.", "ပြင်းထန်သော ယာဉ်မတော်တဆမှု", "အောက်ပါ တစ်ခုခု — လူသေဆုံးခြင်း၊ ယာဉ်လုံးဝ အသုံးမပြုနိုင်ခြင်း (ကညန သတ်မှတ်ချက်အရ)၊ ကုန်ကျစရိတ် သိန်း ၅၀ မှ ၁၀၀ နှင့်အထက်။ Fleet Manager နှင့် Director ကိုင်တွယ်မည်၊ အာမခံသုံးမည်၊ မိသားစုကို ထောက်ပံ့နိုင်သည်။ လျော်ကြေး ၁၀၀% အထိနှင့် စည်းကမ်းအရေးယူမှု။ ယာဉ်မောင်းအပေါ် တရားစွဲဆိုမှုကို ယာဉ်မောင်းကိုယ်တိုင် ဖြေရှင်းရမည်။"], ["3.6", "Leaving the scene", "Fleeing or avoiding responsibility leads to discipline plus action under the law.", "ဖြစ်စဉ်နေရာမှ ထွက်ပြေးခြင်း", "ထွက်ပြေးခြင်း သို့မဟုတ် တာဝန်ရှောင်ခြင်းအတွက် စည်းကမ်းအရေးယူမှုနှင့် ဥပဒေအရ ဆောင်ရွက်မည်။"], ["3.7", "Liability principle", "A driver is not automatically liable. Liability and discipline depend on facts, evidence, the driver's actions and procedure.", "တာဝန်ယူမှု မူ", "ယာဉ်မောင်းကို အလိုအလျောက် တာဝန်ရှိသည်ဟု မသတ်မှတ်ပါ။ အချက်အလက်၊ အထောက်အထား၊ ယာဉ်မောင်း၏ လုပ်ဆောင်ချက်နှင့် လုပ်ထုံးလုပ်နည်းအပေါ် မူတည်သည်။"]], "lab": "3"}, {"n": 4, "en": "Daily operations & maintenance", "my": "နေ့စဉ်ယာဉ်လုပ်ငန်းဆောင်ရွက်မှုနှင့် ယာဉ်ပြုပြင်ထိန်းသိမ်းမှု", "smy": "နေ့စဉ်လုပ်ငန်းနှင့် ထိန်းသိမ်းမှု", "g": ["Safety comes first. Drivers must be fit to drive and check the vehicle before every start.", "ဘေးကင်းရေးကို ဦးစားပေးရမည်။ ယာဉ်မောင်းသည် မောင်းနှင်ရန် ကြံ့ခိုင်ရမည်ဖြစ်ပြီး စက်မနှိုးမီ ယာဉ်ကို စစ်ဆေးရမည်။"], "cl": [["Intro", "Defects", "Report any fault or safety risk to the Fleet Team immediately. Do not drive a vehicle declared unfit.", "ချို့ယွင်းချက်များ", "ချို့ယွင်းမှု သို့မဟုတ် ဘေးအန္တရာယ်ကို Fleet Team ထံ ချက်ချင်း အကြောင်းကြားရမည်။ မောင်းရန်မသင့်ဟု သတ်မှတ်သော ယာဉ်ကို မမောင်းရ။"], ["4.1", "Fitness for duty", "Be physically and mentally fit. Have at least 6 hours of continuous sleep before duty. If exhausted or drowsy, do not drive and report at once.", "တာဝန်ထမ်းဆောင်ရန် ကြံ့ခိုင်မှု", "ရုပ်ပိုင်း၊ စိတ်ပိုင်း ကြံ့ခိုင်ရမည်။ တာဝန်မထမ်းမီ အနည်းဆုံး (၆) နာရီ ဆက်တိုက် အိပ်စက်ရမည်။ ပင်ပန်း၊ အိပ်ငိုက်နေပါက မမောင်းဘဲ ချက်ချင်း အကြောင်းကြားရမည်။"], ["4.2", "Pre-start check", "Before starting the engine: engine oil, coolant and water, brake fluid, fuel, brake system, dashboard warning lights, tyre pressure, tread and alignment, and any new body damage. If a fault is found, park safely and report.", "စက်မနှိုးမီ စစ်ဆေးခြင်း", "Engine Oil၊ Coolant နှင့် ရေ၊ Brake Fluid၊ လောင်စာဆီ၊ ဘရိတ်စနစ်၊ Dashboard Warning Light၊ တာယာလေ၊ တာယာအသွားနှင့် Alignment၊ ကိုယ်ထည် ပျက်စီးမှုအသစ်။ ချို့ယွင်းမှုတွေ့ပါက လုံခြုံသောနေရာတွင် ရပ်ပြီး အကြောင်းကြားရမည်။"]], "lab": "4"}, {"n": 5, "en": "Pay, overtime & benefits", "my": "လစာ၊ အချိန်ပိုကြေးနှင့် ခံစားခွင့်များ", "smy": "လုပ်ခနှင့် ခံစားခွင့်", "g": ["Daily rates by grade and shift, fixed add-ons for ferry and car-share work, and rules for which payments can combine. Rates were set on 22 June 2026 and may be changed by Upper Management.", "အဆင့်နှင့် တာဝန်ချိန်အလိုက် နေ့စဉ်လုပ်ခနှုန်း၊ Ferry နှင့် Car Share အတွက် ပုံသေထပ်ဆောင်းကြေးနှင့် မည်သည့်ငွေများကို တွဲ၍ ရနိုင်သည်ဆိုသည့် စည်းမျဉ်းများ။ နှုန်းထားများကို ၂၂ ဇွန် ၂၀၂၆ တွင် သတ်မှတ်ခဲ့ပြီး Upper Management က ပြောင်းလဲနိုင်သည်။"], "table": "manualRates", "cl": [["5.1", "Grades", "Grade 1.1 (any service), 1.2 (12+ months), 1.3 (30+ months). Accident record, fuel use, skill and management ability may also count.", "အဆင့်များ", "Grade 1.1 (လုပ်သက်မရွေး)၊ 1.2 (၁၂ လနှင့်အထက်)၊ 1.3 (၃၀ လနှင့်အထက်)။ ယာဉ်မတော်တဆမှုမှတ်တမ်း၊ လောင်စာဆီသုံးစွဲမှု၊ ကျွမ်းကျင်မှုနှင့် စီမံနိုင်မှုတို့ကိုလည်း ထည့်သွင်းစဉ်းစားနိုင်သည်။"], ["5.2", "Pay basis", "Paid for actual Day or Night duty, matched across the Assignment Plan, OU-1 Form and Attendance Record.", "ပေးချေမှု အခြေခံ", "Assignment Plan၊ OU-1 Form နှင့် Attendance Record ကိုက်ညီမှုအပေါ် အခြေခံ၍ အမှန်တကယ် ထမ်းဆောင်သော Day/Night Duty အတွက် ပေးချေသည်။"], ["5.3", "Car-In / Car-Out OT", "MEPY area only. Car-In drivers arrive at MEPY before 6:45 am; Car-Out drivers leave MEPY at 6:45 pm.", "Car-In / Car-Out OT", "MEPY ဧရိယာအတွက်သာ။ Car-In — နံနက် ၆:၄၅ မတိုင်မီ MEPY ရောက်ရမည်၊ Car-Out — ညနေ ၆:၄၅ တွင် MEPY မှ ထွက်ရမည်။"], ["5.4", "No doubling", "Car-In/Out OT and Ferry Charge are never both paid on the same day.", "နှစ်မျိုးတွဲ မပေးခြင်း", "တစ်နေ့တည်းတွင် Car-In/Out OT နှင့် Ferry Charge နှစ်မျိုးလုံး မပေးပါ။"], ["5.5", "Trip driver", "No Car-In/Out or Ferry Charge on trip days. A trip can be verified from the Assignment Plan if attendance is missing.", "Trip Driver", "ခရီးစဉ်နေ့များတွင် Car-In/Out နှင့် Ferry Charge မရပါ။ Attendance မရှိပါက Assignment Plan ဖြင့် စစ်ဆေးနိုင်သည်။"], ["5.6", "Breakdown days", "If the vehicle is broken, the first day is paid. From day two, no pay while it is still under repair.", "ယာဉ်ပျက်ရက်များ", "ယာဉ်ပျက်ပါက ပထမနေ့ လုပ်ခပေးသည်။ ဒုတိယနေ့မှစ၍ ပြုပြင်နေဆဲဖြစ်ပါက လုပ်ခမပေးပါ။"], ["5.7", "3-Team Car Share Bonus", "MMK 3,000 a day when the car is shared with three BoxOps teams and KPI ≥ 12 is met.", "3-Team Car Share Bonus", "BoxOps Team (၃) ဖွဲ့နှင့် ယာဉ်မျှဝေပြီး KPI ≥ 12 ပြည့်မီပါက တစ်ရက် MMK 3,000။"], ["5.8", "Ferry Charge", "AM MMK 2,000 and PM MMK 3,000. A substitute who actually drives the ferry receives it.", "Ferry Charge", "AM MMK 2,000 နှင့် PM MMK 3,000။ အမှန်တကယ် မောင်းနှင်သော အစားထိုးယာဉ်မောင်းက ရရှိမည်။"], ["5.9", "Night wage", "Applies to duty between 6:00 pm and 6:00 am.", "Night Wage", "ညနေ ၆:၀၀ မှ နံနက် ၆:၀၀ အတွင်း တာဝန်အတွက် အကျုံးဝင်သည်။"], ["5.10", "Trip benefits", "Daily travelling meal allowance; lodging or hostel for overnight trips.", "ခရီးစဉ် ခံစားခွင့်", "နေ့စဉ် Travelling Meal Allowance၊ ညအိပ်ခရီးအတွက် Staying Charges သို့မဟုတ် Hostel။"]], "lab": "5"}, {"n": 6, "en": "Ferry service", "my": "Ferry ဝန်ဆောင်မှု မူဝါဒ", "smy": "Ferry ဝန်ဆောင်မှု", "g": ["How the staff shuttle is assigned, routed and timed, and how drivers deal with riders.", "ဝန်ထမ်းကြို/ပို့ယာဉ်ကို တာဝန်ချထားပုံ၊ လမ်းကြောင်း၊ အချိန်နှင့် Rider များနှင့် ဆက်ဆံပုံ။"], "cl": [["6.1", "Assignment", "Fleet sets ferry duty and route. No refusing without reason. Fleet may consider drivers' home location.", "တာဝန်ချထားခြင်း", "Fleet က Ferry တာဝန်နှင့် လမ်းကြောင်း သတ်မှတ်သည်။ အကြောင်းပြချက်မရှိဘဲ မငြင်းရ။ ယာဉ်မောင်း၏ နေထိုင်ရာကို ထည့်သွင်းစဉ်းစားနိုင်သည်။"], ["6.2", "Route", "Follow the assigned route. Any change needs Fleet approval.", "လမ်းကြောင်း", "သတ်မှတ်လမ်းကြောင်းအတိုင်း မောင်းရမည်။ ပြောင်းလဲရန် Fleet ခွင့်ပြုချက် လိုသည်။"], ["6.3", "Timing", "Keep start, pick-up, arrival and finish times. Wait at most 3 minutes for a rider, then you may leave. Complaints go to the Fleet Team.", "အချိန်နှင့် စောင့်ချိန်", "စတင်ချိန်၊ ကြိုယူချိန်၊ ရောက်ချိန်နှင့် ပြီးဆုံးချိန်ကို လိုက်နာရမည်။ Rider ကို အများဆုံး (၃) မိနစ်စောင့်ပြီးနောက် ထွက်ခွာနိုင်သည်။ တိုင်ကြားချက်များကို Fleet ထံ တင်ပြရမည်။"], ["6.4", "Detour requests", "Refuse rider requests to detour or interfere, and report them to Fleet.", "လမ်းလွှဲ တောင်းဆိုမှု", "Rider ၏ လမ်းလွှဲတောင်းဆိုမှုကို မလိုက်နာဘဲ Fleet ထံ တင်ပြရမည်။"], ["6.5", "Public holidays", "No ferry run for only 3 riders, unless Fleet specially approves.", "ရုံးပိတ်ရက်", "Rider (၃) ဦးအတွက်သာ Ferry မပြေးရ၊ Fleet အထူးခွင့်ပြုချက်ရှိမှသာ ပြေးဆွဲမည်။"], ["6.6", "Route priority", "P1 ENOU, P2 NOC, P3 MEPY, P4 other ferry routes.", "လမ်းကြောင်း ဦးစားပေးအဆင့်", "P1 ENOU၊ P2 NOC၊ P3 MEPY၊ P4 အခြား Ferry Route များ။"], ["6.7", "Rider safety", "No dangerous, speeding or aggressive driving.", "Rider ဘေးကင်းရေး", "အန္တရာယ်ရှိစွာ၊ အရှိန်လွန်၊ ရန်လိုစွာ မမောင်းရ။"]], "lab": "6"}, {"n": 7, "en": "Technology & GPS", "my": "နည်းပညာနှင့် GPS အသုံးပြုမှု မူဝါဒ", "smy": "နည်းပညာနှင့် GPS", "g": ["As an ISP, Frontiir expects drivers to navigate with Google Maps and GPS every day.", "ISP လုပ်ငန်းဖြစ်သဖြင့် ယာဉ်မောင်းများသည် Google Maps နှင့် GPS ကို နေ့စဉ် အသုံးပြုရမည်။"], "cl": [["7.1", "Smartphone", "Each driver must have a smartphone that can run Google Maps.", "Smartphone", "Google Maps အသုံးပြုနိုင်သော Smartphone တစ်လုံး ရှိရမည်။"], ["7.2", "Using Maps", "Use Google Maps for daily routing, following safety rules so phone handling does not affect driving. Training material is on a shared Google Drive link.", "Google Maps အသုံးပြုခြင်း", "နေ့စဉ်လမ်းကြောင်းအတွက် အသုံးပြုရမည်၊ ဖုန်းကိုင်တွယ်မှုကြောင့် ဘေးကင်းရေး မထိခိုက်စေရ။ လေ့ကျင့်ရေးစာရွက်များကို Google Drive link တွင် ထားရှိသည်။"], ["7.3", "Training", "Fleet trains new drivers on day one and may assess their Maps skills.", "လေ့ကျင့်ခြင်း", "ပထမနေ့တွင် Fleet က လေ့ကျင့်ပေးမည်ဖြစ်ပြီး Maps အသုံးပြုနိုင်မှုကို စစ်ဆေးနိုင်သည်။"]], "lab": "7"}, {"n": 8, "en": "Driver acknowledgement", "my": "ယာဉ်မောင်း၏ လက်မှတ်ရေးထိုးအသိအမှတ်ပြုခြင်း", "smy": "လက်မှတ်ရေးထိုးခြင်း", "g": ["The page drivers sign, confirming they have read and accept the whole manual and its consequences.", "ယာဉ်မောင်းများ လက်စွဲတစ်ခုလုံးနှင့် ၎င်း၏ အကျိုးဆက်များကို ဖတ်ရှုလက်ခံကြောင်း အတည်ပြုလက်မှတ်ထိုးရသည့် စာမျက်နှာ။"], "cl": [["8", "Acknowledgement", "Driver confirms receipt of Version 9.26 and agrees to follow all its policies and procedures.", "အသိအမှတ်ပြုခြင်း", "Version 9.26 ကို လက်ခံရရှိပြီး မူဝါဒ၊ လုပ်ထုံးလုပ်နည်းအားလုံး လိုက်နာရန် သဘောတူကြောင်း။"], ["8", "Consequences", "Driver accepts possible financial liability, recovery of losses, and Warning, Suspension or Termination under company procedure.", "အကျိုးဆက်များ", "ငွေကြေးဆိုင်ရာ တာဝန်ယူမှု၊ ဆုံးရှုံးမှု ပြန်လည်ကောက်ခံမှုနှင့် Warning၊ Suspension သို့မဟုတ် Termination ကို လက်ခံကြောင်း။"], ["8" ment.", "စည်းကမ်းလိုက်နာမှု", "ယာဉ်နှင့် ဝန်ဆောင်မှုကို ဥပဒေ၊ ဘေးကင်းရေးစံနှုန်းနှင့် ဤစာချုပ်အတိုင်း ပေးအပ်ရမည်။"]]}, {"lab": "3", "en": "Term", "my": "စာချုပ်သက်တမ်း", "smy": "စာချုပ်သက်တမ်း", "g": ["How long the agreement lasts and how to extend it.", "စာချုပ်သက်တမ်းနှင့် သက်တမ်းတိုးနည်း။"], "cl": [["3", "Duration", "6 months. The start and end dates, including the year, are left blank to fill in at signing.", "ကာလ", "(၆) လ။ စတင်ရက်နှင့် ကုန်ဆုံးရက် (ခုနှစ်အပါ) ကို လက်မှတ်ရေးထိုးချိန်တွင် ဖြည့်စွက်ရန် ကွက်လပ်ထားသည်။"], ["3", "Renewal", "Only by written agreement of both parties, made at least 7 days before expiry.", "သက်တမ်းတိုးခြင်း", "သက်တမ်းမကုန်မီ အနည်းဆုံး (၇) ရက် ကြိုတင်၍ နှစ်ဦးနှစ်ဖက် စာဖြင့် သဘောတူမှသာ သက်တမ်းတိုးနိုင်သည်။"]]}, {"lab": "4", "en": "Rental charges & payment", "my": "ယာဉ်ငှားရမ်းခနှင့် ငွေပေးချေမှု", "smy": "ငှားရမ်းခနှင့် ငွေပေးချေမှု", "table": "rentalRates", "g": ["Daily rates, overtime, attendance allowance and when Frontiir pays.", "နေ့စဉ်နှုန်း၊ အချိန်ပိုကြေး၊ တက်ရောက်မှုထောက်ပံ့ကြေးနှင့် Frontiir ငွေပေးချေမည့်အချိန်။"], "cl": [["4.1", "Base rental fee", "The base rental fee covers vehicle, driver and fuel: Small Pickup MMK 43,000, Light Truck MMK 46,000 a day. Overtime is MMK 2,500 an hour. With attendance over 22 days, an allowance of MMK 2,000 is paid for every day attended from day 1 of the month.", "အခြေခံ ငှားရမ်းခ (Base Rental Fee)", "အခြေခံငှားခတွင် ယာဉ်၊ ယာဉ်မောင်းနှင့် လောင်စာဆီ ပါဝင်သည် — Small Pickup တစ်ရက် MMK 43,000၊ Light Truck MMK 46,000။ OT တစ်နာရီ MMK 2,500။ တက်ရောက်ရက် ၂၂ ရက်ကျော်ပါက လ၏ ပထမနေ့မှစ၍ တက်ရောက်သည့်ရက်တိုင်း MMK 2,000 ထောက်ပံ့ကြေး။"], ["Table", "Payment schedule", "Advances of MMK 400,000 are paid on the 15th and the 28th; all remaining amounts on the 5th, 6th or 7th.", "ငွေပေးချေရက် ဇယား", "၁၅ ရက်နေ့နှင့် ၂၈ ရက်နေ့တွင် ကြိုတင်ငွေ MMK 400,000 စီ၊ ကျန်ငွေအားလုံးကို ၅ / ၆ / ၇ ရက်နေ့တွင် ပေးချေသည်။"], ["4.1", "Payment after checking", "Frontiir pays within the agreed period after receiving and verifying a correct, complete invoice and supporting documents. (This clause is also numbered 4.1 in the document.)", "စစ်ဆေးပြီးမှ ပေးချေခြင်း", "မှန်ကန်ပြည့်စုံသော Invoice နှင့် အထောက်အထားများကို လက်ခံစစ်ဆေးအတည်ပြုပြီးနောက် သဘောတူကာလအတွင်း ပေးချေမည်။ (စာချုပ်တွင် ဤအပိုဒ်ကိုလည်း ၄.၁ ဟု နံပါတ်တပ်ထားသည်။)"], ["4.2", "Unforeseen events", "After force majeure, epidemics, political conflict, war or natural disasters, both sides renegotiate payment dates and the rental period.", "မမျှော်မှန်းနိုင်သော ဖြစ်ရပ်များ", "မလွန်ဆန်နိုင်သောဖြစ်ရပ်၊ ကပ်ရောဂါ၊ နိုင်ငံရေးပဋိပက္ခ၊ စစ် သို့မဟုတ် သဘာဝဘေး ဖြစ်ပါက ငွေပေးချေရက်နှင့် ငှားရမ်းကာလကို နှစ်ဖက်ပြန်ညှိမည်။"], ["4.3", "Fixed base fee", "The base rental fee does not change for 6 months from signing.", "အခြေခံငှားခ မပြောင်းလဲခြင်း", "စာချုပ်ချုပ်ဆိုသည့်နေ့မှ (၆) လအတွင်း အခြေခံငှားရမ်းခ (Base Rental Fee) မပြောင်းလဲပါ။"]]}, {"lab": "5", "en": "Working hours & overtime", "my": "အလုပ်ချိန် သတ်မှတ်ချက်နှင့် အချိန်ပိုကြေး", "smy": "အလုပ်ချိန်နှင့် အချိန်ပို", "g": ["Daily service hours and how overtime is agreed and checked.", "နေ့စဉ် ဝန်ဆောင်မှုနာရီနှင့် အချိန်ပိုကို ညှိနှိုင်း၊ စစ်ဆေးပုံ။"], "cl": [["5.1", "Service hours", "10 hours a day. Start and finish times are set by Frontiir or agreed in writing.", "ဝန်ဆောင်မှုနာရီ", "တစ်ရက် (၁၀) နာရီ။ စတင်ချိန်နှင့် ပြီးဆုံးချိန်ကို Frontiir က သတ်မှတ်သည် သို့မဟုတ် စာဖြင့် သဘောတူ သတ်မှတ်သည်။"], ["5.2", "Overtime", "Use beyond the set hours or days is agreed in advance and paid at the OT rate in 4.1.", "အချိန်ပို", "သတ်မှတ်နာရီ သို့မဟုတ် ရက်ထက်ကျော်၍ အသုံးပြုပါက ကြိုတင်ညှိနှိုင်းပြီး ၄.၁ ပါ OT နှုန်းဖြင့် ပေးချေမည်။"], ["5.3", "Driver management", "The lessor manages the driver so that service is provided within the set working hours.", "ယာဉ်မောင်း စီမံခန့်ခွဲခြင်း", "သတ်မှတ်ထားသော အလုပ်ချိန်အတွင်း ဝန်ဆောင်မှုပေးနိုင်စေရန် ယာဉ်မောင်းကို အငှားချထားသူက စီမံခန့်ခွဲရမည်။"], ["5.4", "OT claims", "The lessor submits records of overtime actually worked for approval. Fleet checks actual use with the Ground Engineers' Backend Support Team.", "OT တောင်းခံခြင်း", "အမှန်တကယ် ဆောင်ရွက်သော OT မှတ်တမ်းကို တင်ပြ၍ အတည်ပြုချက် ရယူရမည်။ Fleet အဖွဲ့က Ground Engineer များ၏ Backend Support Team နှင့်အတူ အမှန်တကယ် အသုံးပြုမှုကို စစ်ဆေးမည်။"]]}, {"lab": "6", "en": "Maintenance & replacement", "my": "ငှားယာဉ်အား ပြုပြင်ထိန်းသိမ်းခြင်းနှင့် အစားထိုးခြင်း", "smy": "ပြုပြင်ထိန်းသိမ်းခြင်း", "g": ["Who maintains the vehicle and what happens when it is off the road.", "ယာဉ်ကို မည်သူ ပြုပြင်ထိန်းသိမ်းမည်နှင့် ယာဉ်အသုံးမပြုနိုင်ချိန် ဆောင်ရွက်ပုံ။"], "cl": [["6.1", "Maintenance", "The lessor handles routine maintenance, repairs, tyres and parts.", "ပြုပြင်ထိန်းသိမ်းခြင်း", "ပုံမှန်ထိန်းသိမ်းမှု၊ ပြုပြင်မှု၊ တာယာနှင့် အပိုပစ္စည်း လဲလှယ်မှုကို အငှားချထားသူက တာဝန်ယူသည်။"], ["6.2", "Replacement vehicle", "If the vehicle can't be used, the lessor provides a suitable replacement in time.", "အစားထိုးယာဉ်", "ယာဉ်အသုံးမပြုနိုင်ပါက လုပ်ငန်းမထိခိုက်စေရန် သင့်လျော်သော အစားထိုးယာဉ်ကို အချိန်မီ စီစဉ်ပေးရမည်။"], ["6.3", "Pro-rata deduction", "With no replacement, the rental charge is reduced for the time the vehicle was unavailable.", "အချိုးကျ ဖြတ်တောက်ခြင်း", "အစားထိုးယာဉ် မပေးနိုင်ပါက အသုံးမပြုနိုင်သည့်ကာလအတွက် ငှားရမ်းခကို အချိုးကျ ဖြတ်တောက်မည်။"], ["6.4", "Planned downtime", "Known maintenance downtime is notified in advance, with arrangements to avoid disruption.", "ကြိုတင်သိရှိသော ရပ်နားချိန်", "ပြုပြင်ထိန်းသိမ်းမှုကြောင့် အသုံးမပြုနိုင်မည့်အချိန်ကို ကြိုတင်အသိပေးပြီး လုပ်ငန်းမထိခိုက်စေရန် စီစဉ်ပေးရမည်။"]]}, {"lab": "7", "en": "Fuel", "my": "လောင်စာဆီ (Fuel) အသုံးပြုခြင်း", "smy": "လောင်စာဆီ", "g": ["Fuel is included in the rate, with an expected daily and monthly distance.", "လောင်စာဆီကုန်ကျစရိတ်သည် ငှားရမ်းခတွင် ပါဝင်ပြီး နေ့စဉ်/လစဉ် ခန့်မှန်းခရီးအကွာအဝေး သတ်မှတ်ထားသည်။"], "cl": [["7.1", "Fuel included", "Fuel is in the rental charge. Expected use is about 40 km a day and 1,200–1,700 km a month; actual use depends on work, routes and fuel consumption.", "လောင်စာဆီ ပါဝင်ခြင်း", "လောင်စာဆီကုန်ကျစရိတ် ငှားရမ်းခတွင် ပါဝင်သည်။ တစ်ရက် ကီလိုမီတာ ၄၀ ခန့်၊ တစ်လ ကီလိုမီတာ ၁,၂၀၀ မှ ၁,၇၀၀ ခန့် ရည်ရွယ်သည်။ အမှန်တကယ် သုံးစွဲမှုသည် လုပ်ငန်း၊ ခရီးစဉ်နှင့် ဆီစားနှုန်းအပေါ် မူတည်သည်။"], ["7.2", "Extra distance", "Fuel and extra charges beyond the set distance are agreed in advance. No extra (OT) charges without Frontiir's prior written consent.", "အပိုခရီး", "သတ်မှတ်အကွာအဝေးထက် ကျော်ပါက လောင်စာဆီနှင့် ထပ်ဆောင်းကြေး (OT) ကို ကြိုတင်ညှိနှိုင်းရမည်။ Frontiir ၏ ကြိုတင်စာဖြင့် သဘောတူညီချက်မရှိဘဲ တစ်ဖက်သတ် မတောင်းခံရ။"]]}, {"lab": "8", "en": "Driver qualifications & licence", "my": "ယာဉ်မောင်း၏ အရည်အချင်းနှင့် လိုင်စင်", "smy": "ယာဉ်မောင်း အရည်အချင်း", "g": ["The lessor guarantees a qualified, licensed, law-abiding driver.", "အရည်အချင်းပြည့်မီ၊ လိုင်စင်ရှိ၊ ဥပဒေလိုက်နာသော ယာဉ်မောင်းကို အငှားချထားသူက အာမခံရမည်။"], "cl": [["8.1", "Licence", "The driver holds a valid licence for the vehicle class and meets the required qualifications.", "လိုင်စင်", "ယာဉ်အမျိုးအစားအလိုက် တရားဝင်လိုင်စင်ရှိပြီး လိုအပ်သော အရည်အချင်း ပြည့်မီရမည်။"], ["8.2", "Traffic rules", "The driver follows road, traffic and safety rules and the law.", "ယာဉ်စည်းကမ်း", "လမ်းစည်းကမ်း၊ ယာဉ်စည်းကမ်း၊ ဘေးကင်းရေးစည်းမျဉ်းနှင့် ဥပဒေများကို လိုက်နာရမည်။"], ["8.3", "Lessor responsibility", "The lessor is fully responsible for the driver's skill, experience, licence and qualifications.", "အငှားချထားသူ၏ တာဝန်", "ယာဉ်မောင်း၏ စွမ်းရည်၊ အတွေ့အကြုံ၊ လိုင်စင်နှင့် အရည်အချင်းအတွက် အငှားချထားသူက အပြည့်အဝ တာဝန်ယူသည်။"], ["8.4", "Prohibited conduct", "No drink- or drug-driving, unlicensed or careless driving, or traffic violations.", "တားမြစ်ချက်များ", "အရက်/မူးယစ်ဆေးသုံး၍ မောင်းခြင်း၊ လိုင်စင်မဲ့ မောင်းခြင်း၊ မဆင်မခြင် မောင်းခြင်းနှင့် ယာဉ်စည်းကမ်း ဖောက်ဖျက်ခြင်း မပြုရ။"], ["8.5", "Liability for driver fault", "Responsibility applies for losses caused by the driver's negligence, irresponsibility or breach of law (the clause doesn't say whose). The lessor answers for its own responsibility under this agreement or the law.", "ယာဉ်မောင်း အမှားအတွက် တာဝန်", "ယာဉ်မောင်း၏ ပေါ့ဆမှု၊ တာဝန်မဲ့မှု သို့မဟုတ် ဥပဒေချိုးဖောက်မှုကြောင့် ဆုံးရှုံးမှုများအတွက် တာဝန်ရှိသည် (မည်သူ တာဝန်ရှိသည်ကို မဖော်ပြပါ)။ အငှားချထားသူသည် မိမိ၏ တာဝန်ရှိမှုအတွက် ဤစာချုပ် သို့မဟုတ် ဥပဒေအရ တာဝန်ယူရမည်။"]]}, {"lab": "9", "en": "Driver leave & attendance", "my": "ယာဉ်မောင်း၏ ခွင့်ယူမှုနှင့် အလုပ်တက်ရောက်မှု မှတ်တမ်း", "smy": "ခွင့်နှင့် တက်ရောက်မှု", "g": ["How driver leave is notified and attendance is recorded.", "ယာဉ်မောင်း ခွင့်ယူမှုကို အကြောင်းကြားပုံနှင့် တက်ရောက်မှု မှတ်တမ်းတင်ပုံ။"], "cl": [["9.1", "Leave notice", "At least 1 day's notice to Frontiir, with a Leave Form. In emergencies, notify as soon as possible.", "ခွင့်ယူခြင်း", "အနည်းဆုံး (၁) ရက် ကြိုတင်အကြောင်းကြားပြီး Leave Form တင်ရမည်။ အရေးပေါ်ဖြစ်ပါက အမြန်ဆုံး အသိပေးရမည်။"], ["9.2", "Attendance records", "The lessor records attendance and service hours and provides them on request.", "တက်ရောက်မှု မှတ်တမ်း", "အငှားချထားသူသည် တက်ရောက်မှုနှင့် ဝန်ဆောင်ချိန်ကို မှတ်တမ်းတင်ပြီး တောင်းဆိုပါက တင်ပြရမည်။"]]}, {"lab": "10", "en": "Changing vehicle or driver", "my": "ငှားရမ်းမည့်ယာဉ်နှင့် ယာဉ်မောင်း ပြောင်းလဲမှု", "smy": "ယာဉ်/ယာဉ်မောင်း ပြောင်းလဲခြင်း", "g": ["Notice and approval needed to swap the vehicle or driver.", "ယာဉ် သို့မဟုတ် ယာဉ်မောင်း ပြောင်းလဲရန် လိုအပ်သော အသိပေးချက်နှင့် ခွင့်ပြုချက်။"], "cl": [["10.1", "Notice", "At least 14 days' written notice.", "အသိပေးချက်", "အနည်းဆုံး (၁၄) ရက် ကြိုတင်၍ စာဖြင့် အသိပေးရမည်။"], ["10.2", "Approval", "Replacements must meet this agreement and need Frontiir's prior written consent. A replacement vehicle must match the original in type, capability and safety.", "ခွင့်ပြုချက်", "အစားထိုးမှုသည် ဤစာချုပ်နှင့် ကိုက်ညီရပြီး Frontiir ၏ ကြိုတင်စာဖြင့် သဘောတူညီချက် လိုအပ်သည်။ အစားထိုးယာဉ်သည် အမျိုးအစား၊ စွမ်းရည်နှင့် ဘေးကင်းမှုတွင် မူလယာဉ်နှင့် ကိုက်ညီရမည်။"], ["10.3", "Emergencies", "If advance notice isn't possible, inform Frontiir as soon as possible of the situation, the reason and the replacement.", "အရေးပေါ်အခြေအနေ", "ကြိုတင်အသိပေးရန် မဖြစ်နိုင်ပါက lab": "13", "en": "Breach", "my": "စာချုပ်ဖောက်ဖျက်ခြင်း", "smy": "စာချုပ်ဖောက်ဖျက်ခြင်း", "g": ["What happens if either side breaks the agreement.", "စာချုပ်ဝင်တစ်ဦးဦး စာချုပ်ဖောက်ဖျက်ပါက ဆောင်ရွက်ပုံ။"], "cl": [["13.1", "Notice to fix", "The other party gives written notice of a material breach and a reasonable time to fix it.", "ပြင်ဆင်ရန် အသိပေးခြင်း", "အရေးကြီးသော ဖောက်ဖျက်မှုအတွက် စာဖြင့် အသိပေးပြီး ပြင်ဆင်ရန် သင့်လျော်သော အချိန် သတ်မှတ်ပေးနိုင်သည်။"], ["13.3", "Suspension of use", "If the vehicle loses legal use, insurance or licence, the driver's licence is incomplete, or safety is seriously at risk, Frontiir may suspend use and require action.", "အသုံးပြုမှု ယာယီရပ်ဆိုင်းခြင်း", "ယာဉ်၏ တရားဝင်အသုံးပြုခွင့်၊ အာမခံ သို့မဟုတ် လိုင်စင် မရှိခြင်း၊ ယာဉ်မောင်းလိုင်စင် မပြည့်စုံခြင်း သို့မဟုတ် ဘေးကင်းရေးကို အလေးအနက် ထိခိုက်ပါက Frontiir က အသုံးပြုမှုကို ယာယီရပ်ဆိုင်းပြီး ဆောင်ရွက်ရန် တောင်းဆိုနိုင်သည်။"]]}, {"lab": "14", "en": "Termination", "my": "စာချုပ်ရပ်စဲခြင်း", "smy": "စာချုပ်ရပ်စဲခြင်း", "g": ["When and how the agreement can end, and settling up afterwards.", "စာချုပ်ကို ရပ်စဲနိုင်သည့် အခြေအနေ၊ နည်းလမ်းနှင့် ရပ်စဲပြီးနောက် ဖြေရှင်းရမည့်ကိစ္စများ။"], "cl": [["14.1", "Grounds", "(a) the term ends; (b) both agree in writing; (c) a material breach is not fixed in time; (d) the vehicle can no longer be used lawfully; (e) a party can no longer legally operate its business; (f) unavoidable circumstances make performance impossible; (g) the law no longer allows the agreement to continue.", "ရပ်စဲနိုင်သည့် အကြောင်းရင်း", "(က) သက်တမ်းကုန်ဆုံးခြင်း၊ (ခ) နှစ်ဦးစာဖြင့် သဘောတူခြင်း၊ (ဂ) အရေးကြီးဖောက်ဖျက်မှုကို သတ်မှတ်ကာလအတွင်း မပြင်ဆင်ခြင်း၊ (ဃ) ယာဉ်ကို တရားဝင် ဆက်မသုံးနိုင်တော့ခြင်း၊ (င) စာချုပ်ဝင်တစ်ဦးဦး လုပ်ငန်း ဆက်မလုပ်နိုင်တော့ခြင်း၊ (စ) မလွှဲမရှောင်သာသော အခြေအနေကြောင့် တာဝန်များ ဆက်မဆောင်ရွက်နိုင်ခြင်း၊ (ဆ) ဥပဒေအရ စာချုပ်ဆက်ထားရန် မဖြစ်နိုင်ခြင်း။"], ["14.2", "Notice", "At least 14 days' written notice, unless the agreement or the law allows immediate termination.", "အသိပေးချက်", "အနည်းဆုံး (၁၄) ရက် ကြိုတင်၍ စာဖြင့် အသိပေးရမည်၊ စာချုပ် သို့မဟုတ် ဥပဒေအရ ချက်ချင်းရပ်စဲခွင့်ရှိသည့် အခြေအနေမှအပ။"], ["14.3", "Final payment", "Frontiir pays for confirmed services up to the termination date. Advances are reconciled.", "နောက်ဆုံး ငွေပေးချေမှု", "ရပ်စဲသည့်နေ့အထိ အတည်ပြုထားသော ဝန်ဆောင်မှုအတွက် ပေးချေမည်၊ ကြိုတင်ငွေများကို ပြန်လည်ညှိနှိုင်းမည်။"], ["14.4", "Wrap-up", "Both sides settle vehicle return, outstanding payments, documents and other open matters.", "ကိစ္စရပ်များ ဖြေရှင်းခြင်း", "ယာဉ်ပြန်အပ်ခြင်း၊ ကျန်ငွေ၊ စာရွက်စာတမ်းနှင့် မပြီးပြတ်သော ကိစ္စများကို ဖြေရှင်းရမည်။"]]}, {"lab": "15", "en": "Force majeure", "my": "မလွန်ဆန်နိုင်သော ဖြစ်ရပ်များ (Force Majeure)", "smy": "Force Majeure", "g": ["Relief when events beyond either side's control stop performance.", "စာချုပ်ဝင်များ ထိန်းချုပ်နိုင်ခြင်းမရှိသော ဖြစ်ရပ်များကြောင့် တာဝန်မဆောင်ရွက်နိုင်ပါက သက်သာခွင့်။"], "cl": [["15.1", "Relief", "Natural disasters, war, riots, government bans or other uncontrollable events excuse the non-performance they directly cause.", "တာဝန်မှ ကင်းလွတ်ခွင့်", "သဘာဝဘေး၊ စစ်၊ အဓိကရုဏ်း၊ အစိုးရ တားမြစ်မိန့် သို့မဟုတ် ထိန်းချုပ်မရသော ဖြစ်ရပ်များကြောင့် တိုက်ရိုက်ဖြစ်ပေါ်သည့် မဆောင်ရွက်နိုင်မှုအတွက် တာဝန်မှ ကင်းလွတ်ခွင့်ရနိုင်သည်။"], ["15.2", "Notice", "Notify the other side in writing as soon as possible and try to limit the impact.", "အသိပေးခြင်း", "အမြန်ဆုံး စာဖြင့် အသိပေးပြီး ထိခိုက်မှုကို လျှော့ချရန် ကြိုးစားရမည်။"], ["15.3", "Prolonged events", "If service can't continue, both sides discuss the effect on charges, service and the agreement.", "ကြာရှည်ဖြစ်ပေါ်ခြင်း", "ဝန်ဆောင်မှု ဆက်မပေးနိုင်ပါက ငှားရမ်းခ၊ ဝန်ဆောင်မှုနှင့် စာချုပ်ဆက်ထားရှိမှုကို ညှိနှိုင်းရမည်။"]]}, {"lab": "16", "en": "Disputes", "my": "အငြင်းပွားမှု ဖြေရှင်းခြင်း", "smy": "အငြင်းပွားမှု ဖြေရှင်းခြင်း", "g": ["Negotiation first, then the courts or a legal dispute procedure.", "ညှိနှိုင်းဆွေးနွေးမှုကို ဦးစွာ၊ ထို့နောက် တရားရုံး သို့မဟုတ် ဥပဒေအရ အငြင်းပွားမှုဖြေရှင်းရေး လုပ်ထုံးလုပ်နည်း။"], "cl": [["16.1", "Negotiation", "Disputes are first settled by mutual discussion.", "ညှိနှိုင်းဆွေးနွေးခြင်း", "အငြင်းပွားမှုကို ပထမဦးစွာ နှစ်ဖက်ညှိနှိုင်း ဖြေရှင်းရမည်။"], ["16.2", "Courts", "If unresolved, through a competent court or a legal dispute procedure.", "တရားရုံး", "မဖြေရှင်းနိုင်ပါက စီရင်ပိုင်ခွင့်ရှိသော တရားရုံး သို့မဟုတ် ဥပဒေအရ သတ်မှတ်ထားသော လုပ်ထုံးလုပ်နည်းဖြင့် ဖြေရှင်းရမည်။"]]}, {"lab": "17", "en": "General terms & signing", "my": "အထွေထွေ သတ်မှတ်ချက်များနှင့် လက်မှတ်ရေးထိုးခြင်း", "smy": "အထွေထွေ", "g": ["Amendments, assignment, notices, severability, the entire agreement, and signatures.", "စာချုပ်ပြင်ဆင်ခြင်း၊ လွှဲပြောင်းခြင်း၊ အသိပေးခြင်း၊ တစ်စိတ်တစ်ပိုင်း အကျုံးမဝင်ခြင်း၊ စာချုပ်အပြည့်အစုံနှင့် လက်မှတ်များ။"], "cl": [["17.1", "Amendments", "Changes take effect only with both parties' written agreement.", "ပြင်ဆင်ခြင်း", "နှစ်ဦးစာဖြင့် သဘောတူမှသာ အကျိုးသက်ရောက်မည်။"], ["17.2", "Assignment", "The lessor can't transfer its rights or duties without Frontiir's prior written consent.", "လွှဲပြောင်းခြင်း", "Frontiir ၏ ကြိုတင်စာဖြင့် သဘောတူညီချက်မရှိဘဲ အငှားချထားသူသည် အခွင့်အရေး သို့မဟုတ် တာဝန်များကို လွှဲပြောင်းခြင်း မပြုရ။"], ["17.3", "Notices", "Sent to the addresses above, or as later updated in writing. Changes in contact details must be notified in time.", "အသိပေးခြင်း", "အထက်ပါလိပ်စာ သို့မဟုတ် စာဖြင့် ပြင်ဆင်အသိပေးထားသော လိပ်စာသို့ ပေးပို့ရမည်၊ ဆက်သွယ်ရန်အချက်အလက် ပြောင်းပါက အချိန်မီ အသိပေးရမည်။"], ["17.4", "Severability", "If one term is invalid, the rest stay in force.", "တစ်စိတ်တစ်ပိုင်း အကျုံးမဝင်ခြင်း", "သတ်မှတ်ချက်တစ်ခု အကျုံးမဝင်ပါက ကျန်သတ်မှတ်ချက်များ ဆက်လက်အကျုံးဝင်မည်။"], ["17.5", "Entire agreement", "This agreement and its attachments are the full agreement. Later written amendments prevail over earlier agreements.", "စာချုပ်အပြည့်အစုံ", "ဤစာချုပ်နှင့် ပူးတွဲစာရွက်များသည် သဘောတူချက် အပြည့်အစုံဖြစ်ပြီး နောက်ပိုင်း စာဖြင့် ပြင်ဆင်ချက်များအတိုင်း ဆောင်ရွက်ရမည်။"], ["—", "Signing", "Both parties confirm they read and understood the agreement and sign freely, without threat, inducement, undue influence, fraud or misrepresentation, before two witnesses. Signature blocks: lessor, Frontiir and two witnesses (signature, name, NRC, address, phone).", "လက်မှတ်ရေးထိုးခြင်း", "စာချုပ်ကို ဖတ်ရှုနားလည်ပြီး ခြိမ်းခြောက်မှု၊ သွေးဆောင်မှု၊ မလျော်ကန်သော သြဇာ၊ လိမ်လည်မှု သို့မဟုတ် မှားယွင်းဖော်ပြမှုမရှိဘဲ လွတ်လပ်စွာ အသိသက်သေ (၂) ဦး ရှေ့တွင် လက်မှတ်ရေးထိုးကြောင်း။ အငှားချထားသူ၊ Frontiir နှင့် အသိသက်သေများ၏ လက်မှတ်၊ အမည်၊ မှတ်ပုံတင်အမှတ်၊ လိပ်စာ၊ ဖုန်းနံပါတ်။"]]}, {"lab": "A", "en": "Annex: Driver service standards", "my": "နောက်ဆက်တွဲ — အငှားချထားသူက လိုက်နာစေရမည့် ဝန်ဆောင်မှုစံနှုန်းများ", "smy": "ဝန်ဆောင်မှုစံနှုန်း", "g": ["Thirteen service standards the lessor must make its driver follow, which the driver signs. Depending on severity, breaches can lead to Warning, Suspension or immediate termination of the employment or contract.", "အငှားချထားသူက ၎င်း၏ ယာဉ်မောင်းကို လိုက်နာစေရမည့် ဝန်ဆောင်မှုစံနှုန်း (၁၃) ခုဖြစ်ပြီး ယာဉ်မောင်းက လက်မှတ်ရေးထိုးရသည်။ ချိုးဖောက်မှု ပြင်းထန်မှုအလိုက် Warning၊ Suspension သို့မဟုတ် (အလုပ်/စာချုပ်) ချက်ချင်း ရပ်စဲခြင်း ပြုနိုင်သည်။"], "cl": [["1", "Alcohol & drugs", "No use, possession or impairment on duty. Breach can lead to immediate termination of the employment or contract, and the driver must cooperate with the action.", "အရက်နှင့် မူးယစ်ဆေးဝါး", "တာဝန်ချိန်/လုပ်ငန်းခွင်တွင် သုံးစွဲခြင်း၊ ကိုင်ဆောင်ခြင်း၊ မူးယစ်နေခြင်း မရှိရ။ ချိုးဖောက်ပါက (အလုပ်/စာချုပ်) ချက်ချင်း ရပ်စဲခြင်း ပြုနိုင်ပြီး ယာဉ်မောင်းက ကြည်ဖြူစွာ ပူးပေါင်းရမည်။"], ["2", "Company property", "No theft, misuse or unauthorised use. Immediate termination of the employment or contract is possible.", "ကုမ္ပဏီပစ္စည်း", "ခိုးယူခြင်း၊ အလွဲသုံးခြင်း၊ ခွင့်ပြုချက်မဲ့ သုံးခြင်း မပြုရ၊ (အလုပ်/စာချုပ်) ချက်ချင်း ရပ်စဲနိုင်သည်။"], ["3", "Safe driving", "Obey traffic rules. No speeding, dangerous or careless driving.", "ဘေးကင်းစွာ မောင်းနှင်ခြင်း", "ယာဉ်စည်းကမ်း လိုက်နာရမည်၊ အရှိန်လွန်၊ အန္တရာယ်ရှိစွာ၊ မဆင်မခြင် မမောင်းရ။"], ["4", "Daily reports", "Submit Driver Link daily, and a Driver Leave Form when needed. Missing reports can mean no rental payment for that day; a missing leave form carries an MMK 2,500 penalty.", "နေ့စဉ်အစီရင်ခံစာ", "Driver Link ကို နေ့စဉ်၊ လိုအပ်ပါက Driver Leave Form တင်ရမည်။ မတင်ပါက ထိုနေ့ ငှားခ မပေးခြင်း၊ ခွင့်လွှာ မတင်ပါက ဒဏ်ကြေး ၂,၅၀၀ ကျပ် ဖြစ်နိုင်သည်။"], ["5", "Punctuality", "Be on time and ready. Repeated lateness is actionable.", "အချိန်မှန်ခြင်း", "အချိန်မီ ရောက်ရှိ အသင့်ဖြစ်ရမည်၊ ထပ်ခါတလဲလဲ နောက်ကျပါက အရေးယူနိုင်သည်။"], ["6", "BAC testing", "Authorised staff may test at any time. Refusing or obstructing a test is a breach, leading to Warning, Suspension or termination.", "BAC စစ်ဆေးခြင်း", "ခွင့်ပြုထားသူများက အချိန်မရွေး စစ်ဆေးနိုင်သည်၊ ငြင်းဆန်ခြင်း/တားဆီးခြင်းသည် ချိုးဖောက်မှုဖြစ်ပြီး Warning၊ Suspension သို့မဟုတ် ရပ်စဲခြင်း ပြုနိုင်သည်။"], ["7", "Fighting & violence", "No fighting, assault or violence.", "ရန်ဖြစ်ခြင်းနှင့် အကြမ်းဖက်ခြင်း", "ရန်မဖြစ်ရ၊ ကိုယ်ထိလက်ရောက် မကျူးလွန်ရ။"], ["8", "Leaving post", "No leaving without Supervisor approval, and never leave staff at a work site before the job is done.", "တာဝန်ကျနေရာမှ ထွက်ခွာခြင်း", "Supervisor ခွင့်ပြုချက်မရှိဘဲ မထွက်ရ၊ အလုပ်မပြီးမီ ဝန်ထမ်းကို လုပ်ငန်းခွင်တွင် ထားမခဲ့ရ။"], ["9", "Unauthorised drivers", "Don't let staff or outsiders drive the vehicle.", "ခွင့်ပြုချက်မရှိသူ မောင်းခြင်း", "ဝန်ထမ်း သို့မဟုတ် ပြင်ပလူကို ယာဉ်မမောင်းခိုင်းရ။"], ["10", "Resolving workplace issues", "Issues are handled under company policies and escalated step by step to Fleet Team Management, through open discussion, mutual respect and cooperation. Inciting to cause disruption, improperly involving others or deliberately obstructing procedures is actionable, up to termination.", "လုပ်ငန်းခွင်ကိစ္စရပ်များ ဖြေရှင်းခြင်း", "ကိစ္စရပ်များကို ကုမ္ပဏီမူဝါဒနှင့် လုပ်ထုံးလုပ်နည်းအတိုင်း ဖြေရှင်းရမည်ဖြစ်ပြီး Fleet Team Management ထံ အဆင့်ဆင့် တင်ပြကာ ပွင့်လင်းစွာ ဆွေးနွေးခြင်း၊ အပြန်အလှန်လေးစားခြင်း၊ ပူးပေါင်းဆောင်ရွက်ခြင်းဖြင့် ဖြေရှင်းရမည်။ အနှောင့်အယှက်ဖြစ်စေရန် လှုံ့ဆော်ခြင်း၊ အခြားသူများကို မလျော်ကန်စွာ ပါဝင်စေခြင်း၊ လုပ်ထုံးလုပ်နည်းကို တမင် အဟန့်အတားပြုခြင်းအတွက် ရပ်စဲခြင်းအထိ အရေးယူနိုင်သည်။"], ["11", "OT claims", "OT can be claimed only when the day's distance is over 40 km.", "OT တောင်းခံခြင်း", "ထိုနေ့ မောင်းနှင်ကီလိုမီတာ ၄၀ ကျော်မှသာ OT တောင်းခံနိုင်သည်။"], ["12", "Company image", "No pranks on the public, improper behaviour in public, or remarks that harm the company's reputation.", "ကုမ္ပဏီပုံရိပ်", "အများပြည်သူအား Prank ပြုလုပ်ခြင်း၊ မလျော်ကန်သော အပြုအမူ၊ ကုမ္ပဏီဂုဏ်သိက္ခာ ထိခိုက်စေသော အပြောအဆို မပြုရ။"], ["13", "Bribery", "No gifts, money or favours to office staff for personal gain. If any Fleet staff member asks for extra money or a bribe, the driver can report it confidentially to the Fleet Manager.", "လာဘ်ပေးလာဘ်ယူမှု", "ကိုယ်ကျိုးအတွက် ရုံးဝန်ထမ်းများအား လက်ဆောင်၊ ငွေ သို့မဟုတ် မျက်နှာသာ ပေးခြင်း မပြုရ။ Fleet ဝန်ထမ်းတစ်ဦးဦးက တရားမဝင် အပိုငွေ သို့မဟုတ် လာဘ်ငွေ တောင်းပါက ယာဉ်မောင်းသည် Fleet Manager ထံ လျှို့ဝှက်စွာ တိုင်ကြားနိုင်သည်။"], ["—", "Driver signature", "The driver confirms they understand and will follow these rules (signature, name, NRC, address, phone).", "ယာဉ်မောင်း လက်မှတ်", "ယာဉ်မောင်းက စည်းကမ်းချက်များကို နားလည်ပြီး လိုက်နာမည်ဟု ကတိပြု လက်မှတ်ထိုးသည် (လက်မှတ်၊ အမည်၊ မှတ်ပုံတင်၊ လိပ်စာ၊ ဖုန်း)။"]]}]}]};

  P=P||PAYLOAD;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

let h2pPromise=null;
function loadH2P(){
  if(window.html2pdf) return Promise.resolve();
  if(!h2pPromise) h2pPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    s.onload=()=>res(); s.onerror=()=>{h2pPromise=null; rej(new Error("load"));};
    document.head.appendChild(s);
  });
  return h2pPromise;
}

    stage.innerHTML=`<div class="pdfdoc">${pdfDocHTML(list)}</div>`;
    const el=stage.firstElementChild;
    const dd=doc(), fname=`Frontiir-${dd.slug}-${list.length===1?"Section-"+dd.chapters[list[0]].lab:"All"}-${L==="my"?"MY":"EN"}.pdf`.replace(/[()]/g,"");
    const worker=window.html2pdf().set({
      margin:[12,12,14,12], filename:fname, image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:["tr",".pd-chh",".pd-gist"]}
    }).from(el);
    const blob=await worker.outputPdf("blob");
    await saveBlob(fname,blob);
  }catch(e){
    if(!(e&&e.code==="declined")) statusEl.textContent=t("pdfErr");
  }finally{
    stage.innerHTML=""; btn.disabled=false; btn.textContent=label;
  }
}
async function saveBlob(name,blob){
  if(DOWN){ await DOWN.save({filename:name,data:blob}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
}

/* ---------- version history ---------- */
function docRows(){return (rows||[]).filter(x=>(x.doc||"manual")===D);}
function sortRows(r){return r.slice().sort((a,b)=>String(b.uploadedAt||"").localeCompare(String(a.uploadedAt||"")));}
async function renderHistory(){
  if(!FULL) return;
  if(D===ATT||D===POL) return;
  $("histHead").innerHTML=`<tr>${t("cols").map(c=>`<th>${c}</th>`).join("")}${CAN_EDIT?"<th></th>":""}</tr>`;
  const body=$("histBody"), st=$("histStatus"), nw=$("newer");
  nw.hidden=true; st.textContent="";
  if(histState==="offline"){
    body.innerHTML=`<tr><td><b>${esc(doc().contentVersion)}</b> <span class="badge">${t("latest")}</span></td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
    st.textContent=t("histOffline"); return;
  }
  if(histState==="loading"){ body.innerHTML=""; st.textContent=t("histLoading"); return; }
  if(histState==="error"){ body.innerHTML=""; st.textContent=t("histErr"); return; }
  if(histState==="staticErr"){ body.innerHTML=""; st.textContent=t("histStaticErr"); return; }
  const list=sortRows(docRows());
  if(!list.length){ body.innerHTML=""; st.textContent=t("histEmpty"); return; }
  const ids=[...new Set(list.map(r=>r.uploadedBy).filter(Boolean))];
  if(USER&&ids.length){ try{ const ps=await USER.profiles(ids); ids.forEach(id=>names[id]=(ps[id]&&ps[id].name)||""); }catch(e){} }
  body.innerHTML=list.map((r,i)=>{
    let file="—";
    if(r.file) file=`<a href="${esc(r.file)}" download="${esc(r.fileName||"")}">${t("dl")}</a>`;
    else
    if(r.fileKind==="pdf"&&r.assetId) file=`<a href="/_blob/${esc(r.assetId)}" target="_blank" rel="noopener">${t("open")}</a>`;
    else if(r.chunks) file=`<button type="button" class="linkbtn" data-dl="${esc(r._id)}">${t("dl")}</button>`;
    const fn=r.fileName?`<span class="fname">${esc(r.fileName)}</span>`:"";
    const who=r.uploadedBy?(names[r.uploadedBy]||t("someone")):(r.uploadedByLabel?esc(r.uploadedByLabel):"—");
    return `<tr><td><b>${esc(r.version||"—")}</b>${i===0?` <span class="badge">${t("latest")}</span>`:""}</td>
      <td>${fmtDate(r.effectiveDate)}</td><td class="notes">${esc(r.notes||"—")}</td>
      <td>${file}${fn}</td><td class="who"></td><td>${fmtDate(r.uploadedAt)}</td>
      ${CAN_EDIT?`<td><button type="button" class="linkbtn danger" data-rm="${esc(r._id)}">${t("remove")}</button></td>`:""}</tr>`;
  }).join("");
  // names via textContent (other people's input)
  [...body.querySelectorAll("td.who")].forEach((td,i)=>{const r=list[i]; td.textContent=r.uploadedBy?(names[r.uploadedBy]||t("someone")):(r.uploadedByLabel||"—");});
  if(list[0].version&&String(list[0].version)!==doc().contentVersion){ nw.textContent=fill(t("newer"),{v:list[0].version,c:doc().contentVersion}); nw.hidden=false; }
}

async function downloadDocx(id){
  const r=(rows||[]).find(x=>x._id===id); if(!r) return;
  try{
    const snap=await DB.collection(`versions/${id}/chunks`).get();
    const parts=snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(p=>p.d).join("");
    const bin=atob(parts), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    await saveBlob(r.fileName||`${doc().slug}-${r.version||r.effectiveDate}.${r.fileKind||"docx"}`,new Blob([u8]));
  }catch(e){ if(!(e&&e.code==="declined")) $("histStatus").textContent=t("dlErr"); }
}
async function removeVersion(id){
  const r=(rows||[]).find(x=>x._id===id); if(!r) return;
  if(!window.confirm(fill(t("confirmRemove"),{v:r.version||fmtDate(r.effectiveDate)}))) return;
  try{
    if(r.chunks){ const s=await DB.collection(`versions/${id}/chunks`).get(); for(const d of s.docs) await DB.doc(`versions/${id}/chunks/${d.id}`).delete(); }
    if(r.fileKind==="pdf"&&r.assetId&&ASSETS){ try{ await ASSETS.delete(r.assetId); }catch(e){} }
    await DB.doc(`versions/${id}`).delete();
  }catch(e){ $("histStatus").textContent=t("removeErr"); }
}

/* ---------- upload ---------- */
function uErr(msg){ $("uErr").textContent=msg||""; }
function readB64(file){return new Promise((res,rej)=>{const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]||""); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file);});}
function errCode(e){return (e&&e.code)||"";}
async function submitUpload(ev){
  ev.preventDefault(); uErr(""); $("uOk").textContent="";
  const ver=$("uVer").value.trim(), eff=$("uEff").value, notes=$("uNotes").value.trim(), file=$("uFile").files[0];
  if(!ver&&!eff){ uErr(t("eVerOrDate")); $("uVer").focus(); return; }
  if(ver&&docRows().some(r=>String(r.version||"").toLowerCase()===ver.toLowerCase())){ uErr(fill(t("eDup"),{v:ver})); $("uVer").focus(); return; }
  if(!file){ uErr(t("eFile")); $("uFile").focus(); return; }
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext!=="pdf"&&ext!=="docx"){ uErr(t("eType")); return; }
  if(STATIC){ if(file.size>25*1024*1024){ uErr(t("eSizeGh")); return; } staticUpload(ver,eff,notes,file,ext); return; }
  if(ext==="pdf"&&ASSETS&&file.size>20*1024*1024){ uErr(t("eSizePdf")); return; }
  if(ext==="pdf"&&!ASSETS&&file.size>4*1024*1024){ uErr(t("eSizeSmall")); return; }
  if(ext==="docx"&&file.size>4*1024*1024){ uErr(t("eSizeDocx")); return; }
  const btn=$("uSave"); btn.disabled=true; btn.textContent=t("fBusy");
  const label=ver?"Version "+ver:fmtDate(eff);
  const id=D+"-v"+(ver||eff).replace(/[^A-Za-z0-9]+/g,"-").slice(0,40)+"-"+Date.now().toString(36);
  try{
    const me=USER?await USER.id():null;
    const rec={doc:D,version:ver,effectiveDate:eff||"",notes,fileName:file.name,fileKind:ext,uploadedAt:new Date().toISOString()};
    if(me) rec.uploadedBy=me;
    if(ext==="pdf"&&ASSETS){
      const up=await ASSETS.upload(file,{type:"application/pdf"});
      rec.assetId=up.id;
    }else{
      const b64=await readB64(file), SZ=190000, n=Math.ceil(b64.length/SZ);
      for(let i=0;i<n;i++) await DB.doc(`versions/${id}/chunks/c${String(i).padStart(3,"0")}`).set({i,d:b64.slice(i*SZ,(i+1)*SZ)});
      rec.chunks=n;
    }
    await DB.doc(`versions/${id}`).set(rec);
    $("upForm").reset(); $("upForm").hidden=true; $("upBtn").hidden=!(CAN_UP&&FULL);
    $("uOk").textContent=fill(t("okUp"),{v:label});
  }catch(e){
    const c=errCode(e);
    uErr(c==="not_granted"||c==="forbidden"||c==="not_writer"||c==="invalid_argument"||c==="permission_denied"?t("ePerm"):c==="quota_exceeded"||c==="storage_quota_exceeded"?t("eQuota"):c==="too_large"?(ext==="pdf"?t("eSizePdf"):t("eSizeDocx")):c==="unsupported_type"?t("eType"):t("eFail"));
  }finally{ btn.disabled=false; btn.textContent=t("fSave"); }
}

function staticUpload(ver,eff,notes,file,ext){
  const slug=(ver||eff).replace(/[^A-Za-z0-9.]+/g,"-").replace(/^-|-$/g,"");
  const base=file.name.replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9._-]+/g,"_").slice(0,60);
  const fname=`${D}-${slug}-${base}.${ext}`;
  const rec={doc:D,version:ver,effectiveDate:eff||"",notes,file:"files/"+fname,fileName:file.name,uploadedAt:new Date().toISOString(),uploadedByLabel:$("uBy").value.trim()};
  const list=(rows||[]).map(({_id,...x})=>x).concat([rec]);
  saveBlob(fname,file);
  setTimeout(()=>saveBlob("versions.json",new Blob([JSON.stringify(list,null,2)],{type:"application/json"})),600);
  const gh=SITE.repo?`https://github.com/${SITE.repo}/upload/${SITE.branch||"main"}${SITE.path?"/"+SITE.path:""}`:"";
  $("ghPanel").innerHTML=`<h3>${esc(t("ghH"))}</h3><p>${esc(t("ghIntro"))}</p>
    <ul><li><b>${esc(fname)}</b></li><li>${esc(t("ghF2"))}</li></ul>
    <ol><li>${esc(t("ghS1"))}${gh?` <a href="${gh}/files" target="_blank" rel="noopener">${esc(t("ghL1"))}</a>`:""}</li>
    <li>${esc(t("ghS2"))}${gh?` <a href="${gh}" target="_blank" rel="noopener">${esc(t("ghL2"))}</a>`:""}</li>
    <li>${esc(t("ghS3"))}</li></ol>${gh?"":`<p class="small-note">${esc(t("ghNoRepo"))}</p>`}
    <button type="button" class="abtn" id="ghDone">${esc(t("ghDone"))}</button>`;
  $("ghPanel").hidden=false; $("upForm").reset(); $("upForm").hidden=true;
  $("ghDone").addEventListener("click",()=>{ $("ghPanel").hidden=true; $("upBtn").hidden=!FULL; });
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const af=e.target.closest("[data-af]"); if(af){ AF[af.dataset.af]=af.dataset.v; renderAttention(); return; }
  const sc=e.target.closest(".sumcard"); if(sc){ AF.role=AF.role===sc.dataset.role?"all":sc.dataset.role; renderAttention(); return; }
  const tb=e.target.closest("[data-doc]"); if(tb){ if(tb.dataset.doc!==D){ D=tb.dataset.doc; try{localStorage.setItem("fr-doc",D);}catch(_){}
      $("upForm").reset(); $("upForm").hidden=true; $("upBtn").hidden=!(CAN_UP&&FULL); uErr(""); $("uOk").textContent="";
      renderStatic(); renderHistory(); window.scrollTo(0,0);} return; }
  const g=e.target.closest("[data-go]"); if(g){ goTo(+g.dataset.go); return; }
  const p=e.target.closest("[data-print]"); if(p){ doPrint([+p.dataset.print]); return; }
  const f=e.target.closest("[data-pdf]"); if(f){ doPdf([+f.dataset.pdf],f,$("st"+f.dataset.pdf)); return; }
  const d=e.target.closest("[data-dl]"); if(d){ downloadDocx(d.dataset.dl); return; }
  const r=e.target.closest("[data-rm]"); if(r){ removeVersion(r.dataset.rm); return; }
});
$("attPrint").addEventListener("click",printAttention);
$("polPrint").addEventListener("click",printPolicy);
$("polPdf").addEventListener("click",e=>pdfPolicy(e.currentTarget));
$("attPdf").addEventListener("click",e=>pdfAttention(e.currentTarget));
$("printAll").addEventListener("click",()=>doPrint(doc().chapters.map((c,i)=>i)));
$("pdfAll").addEventListener("click",e=>doPdf(doc().chapters.map((c,i)=>i),e.currentTarget,$("allStatus")));
$("upBtn").addEventListener("click",()=>{ $("upForm").hidden=false; $("upBtn").hidden=true; uErr(""); $("uOk").textContent=""; $("uVer").focus(); });
$("uCancel").addEventListener("click",()=>{ $("upForm").reset(); $("upForm").hidden=true; $("upBtn").hidden=!(CAN_UP&&FULL); uErr(""); });
$("upForm").addEventListener("submit",submitUpload);
["uVer","uFile"].forEach(id=>$(id).addEventListener("input",()=>uErr("")));
document.querySelectorAll(".langsw button").forEach(b=>b.addEventListener("click",()=>{
  L=b.dataset.lang; try{localStorage.setItem("fr-lang",L);}catch(e){} renderStatic(); renderHistory();
}));

/* ---------- full access ---------- */
function faErr(k){ const e=$("faErr"), i=$("faPw"); e.textContent=k?t("fa")[k]:""; if(k){ i.setAttribute("aria-invalid","true"); i.select(); i.focus(); } else i.removeAttribute("aria-invalid"); }
function faOpen(){ $("faModal").hidden=false; $("faPw").value=""; faErr(""); setTimeout(()=>$("faPw").focus(),0); }
function faClose(){ $("faModal").hidden=true; $("faBtn").focus(); }
$("faBtn").addEventListener("click",()=>{
  if(FULL){ FULL=false; FINDINGS=null; POLICY=null; if(D===ATT||D===POL){ D=DOCS[0].id; }
    $("upForm").reset(); $("upForm").hidden=true; $("upBtn").hidden=true;
    renderStatic(); return; }
  faOpen();
});
$("faCancel").addEventListener("click",faClose);
$("faModal").addEventListener("click",e=>{ if(e.target===$("faModal")) faClose(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("faModal").hidden) faClose(); });
$("faPw").addEventListener("input",()=>faErr(""));
$("faForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const pw=$("faPw").value, b=$("faGo");
  if(!pw){ faErr("empty"); return; }
  b.disabled=true;
  try{ const x=await unlockWith(pw,PAYLOAD2); FINDINGS=Array.isArray(x)?x:x.FINDINGS; POLICY=x.POLICY||null; }catch(e){ b.disabled=false; faErr("wrong"); return; }
  b.disabled=false; FULL=true; $("faModal").hidden=true;
  $("upBtn").hidden=!CAN_UP;
  renderStatic(); renderHistory(); $("faBtn").focus();
});
renderStatic(); renderHistory();

/* ---------- light up capabilities ---------- */
(async()=>{
  if(!(window.claude&&typeof window.claude.use==="function")){
    STATIC=true; CAN_UP=true; $("uByWrap").hidden=false; $("upBtn").hidden=!FULL;
    try{ const res=await fetch("versions.json",{cache:"no-store"}); if(!res.ok) throw 0;
      const j=await res.json(); rows=(Array.isArray(j)?j:[]).map((x,i)=>Object.assign({_id:"s"+i},x)); histState="ready";
    }catch(e){ histState="staticErr"; }
    renderHistory(); return; }
  [DB,USER,DOWN]=await Promise.all([use("db"),use("user"),use("downloads")]);
  if(!DB){ histState="offline"; renderHistory(); return; }
  try{ CAN_EDIT=USER?!!(await USER.canEdit()):false; }catch(e){ CAN_EDIT=false; }
  let canW=null; try{ canW=USER?await USER.can("data.write"):null; }catch(e){}
  CAN_UP=CAN_EDIT||canW!==false;
  if(CAN_EDIT){ ASSETS=await use("assets"); }
  $("upBtn").hidden=!(CAN_UP&&FULL);
  DB.collection("versions").onSnapshot(snap=>{
    rows=snap.docs.map(d=>Object.assign({_id:d.id},d.data())); histState="ready"; renderHistory();
  },()=>{ histState="error"; renderHistory(); });
})();
}


startApp();
